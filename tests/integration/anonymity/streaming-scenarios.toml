timing_tolerance_ms = 250

[[scenario]]
name = "clean_handshake"
stimulus = "connect_and_establish"

[[scenario]]
name = "small_payload"
stimulus = "one_64_byte_payload_then_ack"

[[scenario]]
name = "send_window_saturation"

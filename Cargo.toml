[workspace]
members = [
    "crates/i2pr-addressbook",
    "crates/i2pr-app-manager-proto",
    "crates/i2pr-app-proto",
    "crates/i2pr-app-package",
    "crates/i2pr-app-state",
    "crates/i2pr-appctl",
    "crates/i2pr-api",
    "crates/i2pr-appd",
    # Plan 369 §G: evidence tooling, not product code. The fixture application is
    # exec'd by i2pr-apphost; the fixture manager stands in for the shipped
    # i2pr-appd sibling in black-box qualification only.
    "crates/i2pr-app-fixture",
    "crates/i2pr-apphost",
    "crates/i2pr-crypto",
    "crates/i2pr-proto",
    "crates/i2pr-client",
    "crates/i2pr-console",
    "crates/i2pr-core",
    "crates/i2pr-daemon",
    "crates/i2pr-i2pcontrol",
    "crates/i2pr-netdb",
    "crates/i2pr-netdb-persist",
    "crates/i2pr-runtime",
    "crates/i2pr-service-tunnels",
    "crates/i2pr-storage",
    "crates/i2pr-su3",
    "crates/i2pr-testkit",
    "crates/i2pr-transport",
    "crates/i2pr-transport-ntcp2",
    "crates/i2pr-transport-ssu2",
    "crates/i2pr-tunnel",
    "tools/i2pr-interop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/dbowm91/i2pr"
license = "MIT"

[workspace.dependencies]
aes = { version = "0.8.4", default-features = false }
bux-seccomp = "=0.2.0"
axum = { version = "0.8", default-features = false, features = ["form", "json", "query"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
curve25519-elligator2 = { version = "0.1.0-alpha.2", default-features = false, features = ["alloc", "elligator2", "precomputed-tables", "zeroize"] }
elligator2 = { version = "0.1.0", default-features = false }
crypto-common = "=0.2.2"
base64ct = { version = "1.8", default-features = false, features = ["alloc"] }
cbc = { version = "0.1", default-features = false, features = ["block-padding"] }
chacha20 = { version = "0.9.1", default-features = false }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
clap = { version = "4.5", default-features = false, features = ["derive", "help", "std", "usage"] }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "group", "precomputed-tables", "zeroize"] }
eggserve-server = { version = "0.4", default-features = false, features = ["tower"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = { version = "0.12.1", default-features = false }
landlock = "=0.4.7"
libc = "=0.2.189"
rand_chacha = "0.9"
rand_core = { version = "0.9", default-features = false }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pki-types = { version = "1.12", default-features = false, features = ["std"] }
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process", "std"] }
sad-rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "sha2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10"
siphasher = { version = "1.0.3", default-features = false }
quick-xml = { version = "=0.42.0", default-features = false }
subtle = { version = "2.6", default-features = false }
tempfile = "3.14"
thiserror = "2.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.48", default-features = false, features = ["io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
webpki-roots = { version = "1.0.9", default-features = false }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
x509-cert = { version = "0.2", features = ["builder", "pem"] }
x509-parser = { version = "0.18", default-features = false, features = ["verify"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = "deny"
unused_must_use = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.release]
panic = "unwind"
lto = false

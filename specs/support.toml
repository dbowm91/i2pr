[[surface]]
id = "ssu2.v2-udp-runtime"
protocol = "ssu2"
structure = "runtime-udp-ownership-transport-manager-integration-local-session-product"
scope = "required"
status = "experimental"
notes = "Plan 158 closed the first SSU2 UDP pass: `i2pr-runtime::Ssu2RuntimeService` owns real UDP sockets (IPv4 loopback tested, IPv6 structurally supported), drives the Plan 156/157 state machines through a central bounded scheduler (one loop task per socket, no task/timer per packet), charges pending handshakes through shared TransportResources with per-IP/subnet caps, promotes atomically through the generic TransportManager as TransportKind::Ssu2 with duplicate-link resolution, admits outbound I2NP through the transport-neutral delivery contract, hands inbound I2NP to a bounded caller-owned sink, caches NewToken announcements for cached-token dials with stale-token Retry fallback, and enforces loopback-only dials with no advertisement. The daemon `[ssu2]` surface is parsed/validated but stays `enabled = false` (activation belongs to Plan 159). Nine real-loopback acceptance tests (tokenless, cached-token with rotation recovery, bidirectional fragmented I2NP, loss/ACK-loss/reorder/duplicate recovery, malformed-traffic boundedness, admission ceilings, graceful/abrupt/cancel baselines) prove the i2pr↔i2pr local product. Publication, path validation/migration, introducers/relays, and independent interop belong to Plans 159-161. PQ-hybrid v3/v4 remains deferred compatibility-watch debt; SSU1 remains unsupported."
evidence = [
    "crates/i2pr-runtime/src/ssu2_runtime.rs",
    "crates/i2pr-runtime/tests/ssu2_local.rs",
    "crates/i2pr-transport-ssu2/src/session.rs",
    "crates/i2pr-daemon/src/config.rs",
    "plans/158-m8-ssu2-udp-runtime-and-local-session-product.md",

notes = "Plan 136 closed as `passed-m7-sam31-protocol-private-destination-foundation` per plans/136-status.md; **Plan 142 reopens and supersedes the Base64 sub-claim** to `passed-m7-sam31-encoding-private-destination-corrective` per plans/142-status.md; **Plan 146 requalifies the private-destination interoperability claim** to `passed-m7-sam31-private-destination-reference-requalification` per plans/146-status.md. The i2pr SAM codec uses the I2P Base64 alphabet (`A-Z a-z 0-9 - ~`, `=` padding) — the spelling every Java I2P / i2pd / independent Python SAM client reference implementation emits — rather than RFC 4648. The private-destination import path now uses the relaxed `DestinationIdentity::from_imported` constructor (Plan 146) that preserves the destination's embedded encryption public field verbatim; only the `signing_public == EdDSA(signing_seed)` structural invariant is enforced. Both i2pd `IdentityEx` and Java I2P `PrivateKeyFile` populate the destination encryption field with random bytes for destinations and treat the `PRIV[391..423]` slot as opaque random material; Plan 146 documents and pins that tolerance. See `specs/references/sam31-private-destination.md` for the four-reference corroboration (i2pd `libi2pd/Base.{h,cpp}`, Java I2P `PrivateKeyFile.java`, i2pd `libi2pd/Identity.cpp`, i2plib `I2P_B64_CHARS = \"-~\"`) and the bidirectional reference evidence at `crates/i2pr-daemon/tests/sam_plan146_reference.rs`. `i2pr-api` owns the bounded line/command/reply parser, typed HELLO VERSION / DEST GENERATE / SESSION CREATE / STREAM CONNECT / STREAM ACCEPT / STREAM FORWARD / NAMING LOOKUP / PING / PONG / QUIT vocabulary, strict SAM 3.1-only version negotiation with typed NOVERSION failure path, the corrected I2P Base64 codec with `+`/`/` rejection and frozen alphabet/padding/length vectors, the SamPrivateDestination wrapper (non-Clone, non-Debug, zeroize-on-drop) carrying the standard Java PrivateKeyFile concatenation, and the runtime-neutral DEST GENERATE / SES
# closed as `passed-destination-lifecycle-and-pools` and lands the
# first `i2pr-client` destination runtime: local destination
# identity (independent Ed25519 signing + X25519 static keys,
# non-`Clone`, non-`Debug` secrets), destination-specific tunnel
# pools that consume real one-shot `EstablishedMaterial`, local
# Standard LeaseSet2 construction and signing with self-validation
# through `i2pr-netdb`, LeaseSet2 lifecycle with bounded
# rotation/withdrawal, bounded local payload contracts, and a
# router-local destination registry. Plan 121 closed as
# `passed-ecies-destination-session-layer` and lands the first
# real ECIES-X25519-AEAD-Ratchet destination Garlic/session layer
# with the audited `elligator2 = 0.1.0` reviewed primitive
# (Plan 131 swap; `curve25519-elligator2 = 0.1.0-alpha.2` retired
# because its `RFC9380::to_representative` branch choice was
# deterministic rather than caller-randomizable and its
# `Randomized` mode rotated the derived X25519 public key),
# the wrapped ECIES primitives in `i2pr-crypto`, the bounded
# structural Garlic payload block codec in `i2pr-proto`, and the
# bounded destination-context `EciesSessionManager` in
# `i2pr-client`. Remote destination routing and the streaming
# protocol remain Plan 122/123 scope. Router construction is not

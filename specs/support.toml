notes = "Plan 125 landed the canonical RFC 1952 gzip client-payload framing and the real SYN/SYN-response lifecycle; its `passed-milestone6-local-corrective-closure` claim was withdrawn by the post-Plan-125 audit and Plan 125 is now `superseded-by-final-corrective-closure` (Plan 123 is restored as `passed-corrected-streaming-wire-local`). Plan 125 replaces the custom Plan 123 `ClientPayload` framing with the canonical RFC 1952 gzip wire format (no SHA-256, no custom compressed-length prefix; bounded decompressed-size enforcement; explicit trailing-byte rejection), restores the real Plan 125 §6/§7 SYN / SYN-response lifecycle (originator SYN uses `sendStreamId = 0`; recipient SYN response uses `sendStreamId = originator receiveStreamId` and `receiveStreamId = recipient-selected id`), splits stream-id ownership between `local_receive_stream_id` and `peer_receive_stream_id`, negotiates the maximum packet payload as `min(local, remote)`, fixes the broken `SystemClock` to anchor at an origin `Instant`, and adds the runtime-neutral `StreamingDestinationAdapter` (`crates/i2pr-client/src/streaming_adapter.rs`) that bridges `TransportSendRequest` into the Plan 122 `compose_outbound_delivery` pipeline. The retained Plan 123 VirtualWire tests (`crates/i2pr-client/tests/plan123_trajectory.rs`, 16 cases) remain as fast Streaming-only fault tests; the new `plan125_trajectory` tests cover the real handshake lifecycle, the gzip wire format, the listener outcome, and the bidirectional `inbound_by_stream` / `outbound_by_stream` connection lookup. Plan 125 does not claim mixed-router or live-network interoperability; the runtime adapter for SAM, NTCP2, and SSU2 is future scope. Plan 128 closed as `passed-streaming-wire-protocol-corrective-closure` and corrected the packet wire format to the current I2P Streaming specification: normative flag map with policy sets `0x04A9` / `0x00A9` / `0x000A` / `0x000C`, no option-data TLVs, flag-driven option order, 2-byte big-endian payload-only MAX
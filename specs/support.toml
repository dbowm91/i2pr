protocol = "ssu2"
structure = "authenticated-path-migration-conservative-reachability-deterministic-selection"
scope = "required"
status = "experimental"
notes = "Plan 159 closed authenticated path handling, conservative publication policy, and deterministic transport selection without changing wire semantics or enabling production publication. `i2pr-transport-ssu2::path` owns the runtime-neutral validation machine (bounded per-family candidates, 32-byte challenges, 10 s deadlines, minimum-MTU candidates, no packet-driven MTU); `Ssu2Session::note_path_migrated` requeues unacked fragments through the bounded loss policy with flight/cwnd reset; `i2pr-transport::reachability` owns the corroboration-floor-two router policy (one observation can never reach Reachable); `i2pr-transport-ssu2::publication` builds deterministic canonical snapshots (direct form needs Reachable plus explicit opt-in; otherwise unpublished firewalled; expiry withdraws); `i2pr-transport::selection` picks NTCP2/SSU2 deterministically (reuse first, Dial/DialFallback, address-failure isolation) through the generic manager. `i2pr-runtime` drives validators after session authentication with single-shot minimum-MTU controls, scheduler-owned expiry, and privacy-safe counters. Proven by 9 sealed-packet trajectories, inline unit matrices, and 3 real-UDP tests (bidirectional migration with delivery proof, spoof boundedness, control round trip). Daemon `[ssu2]` activation and non-loopback dials stay fail-closed; peer-test/relay roles belong to Plan 160 and independent interop to Plan 161. PQ-hybrid v3/v4 remains deferred compatibility-watch debt; SSU1 remains unsupported."

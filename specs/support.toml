protocol = "ssu2"
structure = "runtime-neutral-noise-xk-establishment-token-lifecycle-routerinfo-binding"
scope = "required"
status = "experimental"
notes = "Plan 156 closed the runtime-neutral SSU2 v2 establishment protocol in `i2pr-transport-ssu2` (no UDP socket, no runtime service): Noise XK transcript (`Noise_XKchaobfse+hs1+hs2+hs3_25519_ChaChaPoly_SHA256`) with role-gated consuming transitions and split directional keys; ChaCha20 header protection per the Header Encryption KDF pseudocode; strict TokenRequest/Retry/SessionRequest/SessionCreated codecs with symmetric-only cheap prevalidation before DH; bounded SessionConfirmed fragmentation/reassembly (15 fragments, 32 KiB aggregate, RouterInfo-first); bounded one-use token lifecycle (8-byte source-bound values, 30 s lifetime, 256-global/4-per-source quotas, rotation invalidation, 3x Retry amplification budget); deep RouterInfo establishment binding (signature, expected hash, v=2 address, static-key binding, intro-key shape, publication freshness) without NetDB mutation; consuming initiator/responder machines with spec resend schedules and a 20 s terminal deadline. Data phase, UDP runtime, and interoperability belong to Plans 157-161. PQ-hybrid v3/v4 remains deferred compatibility-watch debt; SSU1 remains unsupported."

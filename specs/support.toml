[[surface]]
id = "ssu2.v2-data-phase"
protocol = "ssu2"
structure = "runtime-neutral-authenticated-data-packets-ack-loss-fragmentation-reassembly"
scope = "required"
status = "experimental"
notes = "Plan 157 closed the runtime-neutral SSU2 v2 data phase in `i2pr-transport-ssu2` (no UDP socket, no runtime service): the authenticated `Ssu2Session` short-header path with the corrected two-step data KDF (`HKDFSSU2DataKeys` into `(k_data, k_header_2)` per direction, `k_header_1` as receiver intro key), full packet-number window (128-packet replay bitmap, future-jump cap, wrap/exhaustion handling), strict ACK range interpretation with loop-free delayed/immediate per-session scheduling, fresh-packet retransmission with per-fragment ceilings, RFC 6298-style RTT/RTO with a conservative byte-count congestion controller, exact MTU-aware I2NP fragmentation with strict reassembly quotas and bounded duplicate suppression, and termination/rekey/idle handling with privacy-safe counters. Seventeen deterministic fault trajectories, unit boundary tests, and two committed data-phase vectors pin the behavior. UDP runtime and interoperability belong to Plans 158-161. PQ-hybrid v3/v4 remains deferred compatibility-watch debt; SSU1 remains unsupported."

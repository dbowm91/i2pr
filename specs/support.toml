# status is `passed-final-local-closure` (terminal cleanup pass),
# Plan 117 status is `closed-for-progression-with-evidence-gap` per
# Plan 118 Phase B (Outcome 2); the corrected in-tree Emissary test
# reached native OBEP admission and reply AEAD opening, then
# rejected the pinned reference's non-normative request-prefixed
# reply plaintext. The pinned Emissary revision
# `9b43484a21d5a1291c4881cdae62a36c527f8c0f` (emissary-core 0.4.0)
# remains the reference pin; Plan 118 Phase B1 confirmed no usable
# upstream correction exists, so the bounded Plan 117 native closure
# campaign is closed for progression. Plan 117 corrective closure
# ([plans/117-corrective-closure.md](plans/117-corrective-closure.md))
# corrected four routing/framing/activation/readiness defects (C1–C4),
# passed Phase G all-i2pr production-seam terminal trajectory,
# achieved `passed-emissary-wire-format-compatibility` at stage
# `h_emissary_database_lookup_parsed`, and classified Phase I
# authenticated transport as `deferred-host-lane-unavailable` on this
# host. Plan 109 and Plan 110 are superseded by Plan 111 for the
# short-build local conformance surface; inbound uses the explicitly
# named `reference-compatible-spec-text-discrepancy` policy because
# the final-spec prose has no concrete plaintext encoding while Java
# I2P and i2pd agree on the originator fake. Plan 114 closes four
# post-Plan-113 routing/composition defects: explicit outbound
# `outbound_reply_router` and inbound `originator_hash` terminal-
# routing fields, intermediate tunnel-id chain continuity enforced
# at both the high-level and the public lower-level builder, and
# strict outbound/inbound E2E trajectories that deterministically
# reach `Established`. Plan 115 adds the canonical production I2NP
# bridge (`ShortBuildI2npBridge`) so the already count-prefixed
# `ShortBuildAction::Deliver.message` is wrapped in a single
# complete I2NP type-25 message without double-prefixing the STBM
# record count byte, with a round-trip body equality assertion. Plan
# 115 Q0 construction + native OBEP reply has passed locally against
# pinned Emissary — see plans/115-status.md for the closure record,
# digests, and pinned revision. Q1/Q2/qualified-external-delivery
# still pending. Plan 118 closed the planning authority surface and

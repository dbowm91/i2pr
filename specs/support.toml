conformance_note = "Plan 111/112 preserve local outbound conformance. Plan 113 closes inbound as `reference-compatible-spec-text-discrepancy`: the final specification mentions a creator ephemeral key in inbound plaintext but gives no serializable location, while pinned Java I2P and i2pd agree on the deployed originator fake. The real request retains fixed fields + Mapping/padding; exactly one originator fake carries `hash16 || fresh X25519 pub32 || random remainder` and is integrity-checked after reply processing. Plan 114 closes the four post-Plan-113 routing/composition defects: explicit outbound `outbound_reply_router` and inbound `originator_hash` terminal-routing fields, intermediate `hops[i].next_tunnel == hops[i+1].receive_tunnel` chain continuity enforced at both the high-level `ShortBuildPath::validate()` boundary and the public lower-level `prepare_short_build_message()` entry point, and strict outbound/inbound E2E trajectories that deterministically reach `Established`. Plan 115 Emissary Q0 construction + native OBEP reply has passed locally against pinned Emissary at 9b43484a21d5a1291c4881cdae62a36c527f8c0f: the i2pr-produced STBM is consumed by Emissary's native short-build handler, Emissary replies with `TunnelGateway` + Garlic inner message + feedback channel. This is not a strict final-spec conformance claim for the unresolved inbound creator-key sentence. Q1 (authenticated transport delivery) and Q2 (reply round-trip to `Established`) remain pending on a qualified external delivery lane. Plan 116 closed as `passed-local-tunnel-data-plane` via the Plan 116 completion/correction pass (defects `C1`–`C16`): canonical `SHA256(post_zero_record_bytes || IV)[0..4]` checksum builder/parser with distinct unfragmented vs fragmented-first wire encodings; AES-256 ECB-DEC/CBC-DEC/ECB-DEC creator inverse with OBEP applying the participant forward transform; CSPRNG-injected fresh IV per cell and random nonzero padding; `Option<EstablishedNextHop>` typed next-hop st
tream.updateAcks` (ackThrough = highest received incl. buffered; bounded missing-sequence NACKs), a synchronous `poll_acks` emits coalesced standalone delayed ACKs on the 750 ms reference default with piggyback suppression and no ACK-of-ACK loop, the wire destination_port owns listener dispatch (exact match, wildcard port-0 fallback, typed NoMatchingListener) with enforced established port tuples (`PortTupleMismatch`), the integrated fixture keeps tunnel duplicate windows live across deliveries, exact cell replays fail as typed `TunnelRoleError::DuplicateCell`, and eleven full-stack trajectories in `crates/i2pr-client/tests/plan130_trajectory.rs` close the Milestone 6 local product gate. Plan 129 is `superseded-by-plan130-final-gate`."

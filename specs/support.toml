# Machine-readable workspace support inventory (current evidence
# through the Plan 114 terminal-routing and tunnel-chain correction
# landing plus the Plan 115 canonical production I2NP bridge closure
# and Emissary Q0 construction + native OBEP reply completion;
# Plan 111 status is `passed-final-local-short-build-conformance`
# per plans/111-short-build-final-local-conformance-correction.md
# and plans/111-status.md, Plan 112 status is
# `passed-outbound-pre-delivery-closure` per
# plans/112-113-post-plan111-pre-delivery-corrective-roadmap.md,
# plans/112-outbound-short-build-pre-delivery-closure.md, and
# plans/112-status.md, Plan 113 status is
# `passed-inbound-reference-reconciliation`, Plan 114 status is
# `passed-terminal-routing-chain-correction`, and Plan 115 status is
# `passed-emissary-q0-construction-and-obep-reply-only` (supersedes
# the historical Branch E closure). Plan 116 status is
# `implementation-landed-partial-scaffolding`: the local tunnel
# data plane modules (AES layer transforms, fragment builder/parser,
# `BoundedReassembler`, established secret-material ownership, and
# runtime-neutral role composition) compile cleanly under
# `cargo check -p i2pr-tunnel` and `cargo clippy --workspace
# --all-targets -- -D warnings`. The deterministic outbound →
# inbound pair, full fragmentation, `ShortBuildRegistrar` wiring,
# and `ExploratoryPool` reply-path semantics remain pending; see
# `plans/116-status.md`. Plan 109 and Plan 110 are
# superseded by Plan 111 for the short-build
# local conformance surface; inbound uses the explicitly named
# `reference-compatible-spec-text-discrepancy` policy because the
# final-spec prose has no concrete plaintext encoding while Java I2P
# and i2pd agree on the originator fake. Plan 114 closes four
# post-Plan-113 routing/composition defects: explicit outbound
# `outbound_reply_router` and inbound `originator_hash` terminal-
# routing fields, intermediate tunnel-id chain continuity enforced
# at both the high-level and the public lower-level builder, and
# strict outbound/inbound E2E trajectories that deterministically
# reach `Established`. Plan 115 adds the canonical production I2NP
# bridge (`ShortBuildI2npBridge`) so the already count-prefixed
# `ShortBuildAction::Deliver.message` is wrapped in a single
# complete I2NP type-25 message without double-prefixing the STBM
# record count byte, with a round-trip body equality assertion. Plan
# 115 Q0 construction + native OBEP reply has passed locally against
# pinned Emissary — see plans/115-status.md for the closure record,
# digests, and pinned revision. Q1/Q2/qualified-external-delivery
# still pending. Structural evidence may be recorded before
# interoperability; all entries remain non-advertised until the
# external delivery; all entries remain non-advertised.

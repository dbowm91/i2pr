[[surface]]
id = "tunnel.ecies-x25519-short-build-crypto"
protocol = "tunnels"
structure = "local-ecies-x25519-noise-n-short-build-cryptography-and-state-machine"
scope = "required-later"
status = "experimental"
conformant = true
conformance_note = "Plan 111 closed as `passed-final-local-short-build-conformance` and Plan 112 closed as `passed-outbound-pre-delivery-closure`: the corrected Noise-N transcript applies the canonical null-prologue MixHash and runs the request `es` derivation as a single `HKDF(ck, shared, '', 64)` whose first 32 bytes become the new chaining key and whose second 32 bytes become the request AEAD key. The 218-byte encrypted envelope (`truncated_hash_prefix (16) || ephemeral_pub (32) || ciphertext (154) || tag (16)`) and 202-byte reply plaintext are byte-for-byte conformant with the current official I2P Tunnel Creation Specification. The slot byte for the hop-own reply AEAD nonce and raw ChaCha20 other-record transform lives at offset 4 of the 12-byte nonce. The OBEP `RGarlicKeyAndTag` continuation produces a 32-byte key and an 8-byte tag. Per-hop `receive_tunnel` and `next_tunnel` identifiers are explicit independent `TunnelId` fields. The per-hop processor decodes the role from the authenticated request plaintext rather than flattening to participant. Multi-record slot allocation, fake records, raw ChaCha20 preprocessing/postprocessing, and the one-byte-count STBM/OTBRM payload framing (validated through `validate_count_prefixed_short_payload` and `encode_count_prefixed_short_payload`) are byte-for-byte conformant against fixed vectors. The CSPRNG-filled post-Mapping plaintext padding, the `ShortBuildPath::validate` direction/role topology validator, and the typed `InboundBuildPendingReconciliation` fail-closed gate that holds inbound production construction are enforced under Plan 112. Inbound creator-ephemeral plaintext semantics remain `blocked-inbound-layout-ambiguity` until Plan 113 reconciles the inbound creator-ephemeral standards/reference discrepancy. Live mixed-router execution is blocked on a qualified external delivery lane."
evidence = [
    "crates/i2pr-tunnel/src/build_crypto.rs",
    "crates/i2pr-tunnel/src/short.rs",
    "crates/i2pr-tunnel/src/short_record.rs",
    "crates/i2pr-tunnel/src/short_state.rs",
    "crates/i2pr-tunnel/src/responder.rs",
    "crates/i2pr-tunnel/src/conformance_fixtures.rs",
    "crates/i2pr-tunnel/src/fixed_vectors.rs",
    "crates/i2pr-crypto/src/hkdf.rs",
    "plans/111-short-build-final-local-conformance-correction.md",
    "plans/111-status.md",
]
advertised = false

[[surface]]
id = "tunnel.short-build-conformance-fixture"
protocol = "tunnels"
structure = "independent-reference-noise-n-and-smtunnel-kdf-fixture-and-frozen-fixed-vectors"
scope = "required-later"
status = "experimental"
conformant = true
conformance_note = "Plan 111 added a frozen `fixed_vectors` module whose constants were generated once from an independent reference Noise-N + HKDF-SHA256 + ChaCha20-Poly1305 oracle (using only low-level primitives, never the production `BuildCryptography` seam) and are committed as Rust constants. Every `cargo test` run asserts the production primitive matches the frozen constants for the canonical fixed inputs; drift in either side fails the test. The historical single-record and multi-hop fixtures remain for backward compatibility. Plan 112 added the Rust-only reference provenance test under `crates/i2pr-tunnel/tests/plan111_reference_vectors.rs` that re-derives the same frozen bytes from a pure-Rust path built only on `x25519-dalek`, `sha2`, `chacha20poly1305`, and `i2pr_crypto::hkdf_sha256_extract_and_expand`, without consulting the frozen module. The test asserts the production seal, open, and `LayerKeys` derivations reproduce the frozen constants byte-for-byte and that re-encryption of the sealed envelope produces identical bytes. This proves the constants were not generated from the production primitive under audit and provides a reproducible independent reference path for any future drift investigation."
evidence = [
    "crates/i2pr-tunnel/src/conformance_fixtures.rs",
    "crates/i2pr-tunnel/src/fixed_vectors.rs",
    "crates/i2pr-tunnel/src/multirecord.rs",
    "plans/111-short-build-final-local-conformance-correction.md",

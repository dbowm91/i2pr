notes = "Plan 142 closed the I2P Base64/private-destination encoding correction, and Plan 146 closed bidirectional private-destination reference compatibility against the pinned Java I2P and i2pd references. Plan 147's dedicated same-socket raw TCP↔Streaming bridge is retained as the focused lower-level regression. Plan 149 closed the self-composed localhost STREAM product: SESSION CREATE allocates one shared Arc<DestinationIdentity>, signs and publishes the local LeaseSet2, installs the local-product delivery fabric and SAM bridge, starts one supervised destination driver, resolves local peer LeaseSet2 records through the SAM service directory, preserves same-read bytes, honors both SILENT modes, emits authenticated non-silent peer metadata, records typed delivery degradation, and cleans up terminal ownership. Plan 148 remains historical blocked-audit evidence because it correctly rejected one Rust helper used twice as independent clients. Plan 150 closed the localhost external-client layer through the real listener: exact i2psam revision `b80ecd487f7b8d1a743a1f40337b2eb0caaae6ac` and qualified unmodified i2plib.sam revision `6edf51cd5d21cc745aa7e23cb98c582144884fa8` pass bidirectional binary STREAM, SILENT, private-destination, FORWARD, NAMING, negative, lifecycle, and reproducibility evidence. The pinned libsam3 revision `7d6e658798baec31394c5685f9583343cc00900b` is built and probed but not counted because its public API requires an 884-character private key while i2pr's canonical Ed25519 SAM PRIV is 608 characters. Evidence is summarized in `tests/integration/sam/evidence.md` and generated sanitized artifacts under `target/interop/sam-evidence`. No SAM feature is advertised, and router-to-router interoperability remains unclaimed."

[[surface]]
id = "ssu2.v2-protocol-foundation"
protocol = "ssu2"
structure = "runtime-neutral-v2-address-header-block-primitives"
scope = "required"
status = "experimental"
notes = "Plan 155 closed the Milestone 8 SSU2 v2 protocol foundation. `i2pr-transport-ssu2` is runtime-neutral (no Tokio, no sockets, no async): strict v2 RouterAddress parsing/validation (style SSU2, v=2, 32-byte static/intro keys, numeric-IP host, UDP port, MTU floor 1280, bounded caps, bounded introducers; v3/v4 classified unsupported/deferred), structural long/short header codecs (message types 0/1/2/6/7/9/10/11, version 2, network ID 2), and the bounded authenticated-plaintext block vocabulary (DateTime/Options/RouterInfo/I2NP/FirstFragment/FollowOnFragment/Termination/RelayRequest/RelayResponse/RelayIntro/PeerTest/NewToken/PathChallenge/PathResponse/Address/RelayTagRequest/RelayTag/FirstPacketNumber/Congestion/Padding with unknown-block byte/count ceilings). No handshake, no header protection/AEAD, no UDP socket, no interoperability claim; those belong to Plans 156-161. PQ-hybrid v3/v4 remains deferred compatibility-watch debt; SSU1 remains unsupported."

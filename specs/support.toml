[[surface]]
id = "client.streaming-core"
protocol = "streaming"
structure = "minimal-interoperable-i2p-streaming-core"
scope = "required"
status = "experimental"
notes = "Plan 125 landed the canonical RFC 1952 gzip client-payload framing and the real SYN/SYN-response lifecycle; its `passed-milestone6-local-corrective-closure` claim was withdrawn by the post-Plan-125 audit and Plan 125 is now `superseded-by-final-corrective-closure` (Plan 123 is restored as `passed-corrected-streaming-wire-local`). Plan 125 replaces the custom Plan 123 `ClientPayload` framing with the canonical RFC 1952 gzip wire format (no SHA-256, no custom compressed-length prefix; bounded decompressed-size enforcement; explicit trailing-byte rejection), restores the real Plan 125 §6/§7 SYN / SYN-response lifecycle (originator SYN uses `sendStreamId = 0`; recipient SYN response uses `sendStreamId = originator receiveStreamId` and `receiveStreamId = recipient-selected id`), splits stream-id ownership between `local_receive_stream_id` and `peer_receive_stream_id`, negotiates the maximum packet payload as `min(local, remote)`, fixes the broken `SystemClock` to anchor at an origin `Instant`, and adds the runtime-neutral `StreamingDestinationAdapter` (`crates/i2pr-client/src/streaming_adapter.rs`) that bridges `TransportSendRequest` into the Plan 122 `compose_outbound_delivery` pipeline. The retained Plan 123 VirtualWire tests (`crates/i2pr-client/tests/plan123_trajectory.rs`, 16 cases) remain as fast Streaming-only fault tests; the new `plan125_trajectory` tests cover the real handshake lifecycle, the gzip wire format, the listener outcome, and the bidirectional `inbound_by_stream` / `outbound_by_stream` connection lookup. Plan 125 does not claim mixed-router or live-network interoperability; the runtime adapter for SAM, NTCP2, and SSU2 is future scope. Plan 128 closed as `passed-streaming-wire-protocol-corrective-closure` and corrected the packet wire format to the current I2P Streaming specification: normative flag map with policy sets `0x04A9` / `0x00A9` / `0x000A` / `0x000C`, no option-data TLVs, flag-driven option order, 2-byte big-endian payload-only MAX_PACKET_SIZE (default 1730), raw final signatures from signing-key context (retained peer key for CLOSE/RESET without FROM since 0.9.20), canonical zeroed-placeholder preimage signed once, eight Proposal 164 replay NACK words on the initial SYN only, split validate_initial_syn / validate_syn_response, and min-of-advertisements negotiation. Provenance: `specs/references/streaming-packet-wire.md`; wire fixtures `crates/i2pr-proto/tests/plan128_wire.rs`; manager trajectories `crates/i2pr-client/tests/plan128_trajectory.rs`. Plan 129 closed as `passed-milestone6-integrated-local-product-gate`: one combined runtime-neutral outbound/inbound adapter (outbound bound `MAX_STREAMING_ADAPTER_PAYLOAD_BYTES = MAX_CLIENT_PAYLOAD_BYTES` with a single canonical Data-envelope owner; inbound I2NP Data -> gzip -> protocol-6 -> I2P ports -> Streaming dispatch with typed `UnsupportedProtocol` outcome), integrated retransmission (`poll_retransmits`), cumulative end-to-end ACKs clearing tracked packets, ordered delivered-byte surfacing after reorder (`drain_delivered`), and CLOSE/RESET completion policy; twelve deterministic tests in `crates/i2pr-client/tests/plan129_trajectory.rs` drive the complete stack in both directions. `milestone6_local_product = passed`; `milestone6_interoperable = not-yet-claimed`; SAM baseline planning (Milestone 7) is next. Plan 130 closed as `passed-milestone6-final-wire-runtime-corrective-closure` and corrected the runtime semantics around the retained Plan 128 codec: production Elligator2 representatives carry the normative randomized high bits (deterministic vector constructor unchanged; evidence in `specs/references/elligator2-production-representation.md`), application sequence numbering starts at 1 post-SYN with seq-0 reserved for SYN/SYN-response/plain-ACK, `ackThrough == 0` is a flag-driven valid acknowledgement, NACK-aware cumulative ACKs retain explicitly NACKed packets (Java `Connection.ackPackets` contract), receiver ack views follow `MessageInputStream.updateAcks` (ackThrough = highest received incl. buffered; bounded missing-sequence NACKs), a synchronous `poll_acks` emits coalesced standalone delayed ACKs on the 750 ms reference default with piggyback suppression and no ACK-of-ACK loop, the wire destination_port owns listener dispatch (exact match, wildcard port-0 fallback, typed NoMatchingListener) with enforced established port tuples (`PortTupleMismatch`), the integrated fixture keeps tunnel duplicate windows live across deliveries, exact cell replays fail as typed `TunnelRoleError::DuplicateCell`, and eleven full-stack trajectories in `crates/i2pr-client/tests/plan130_trajectory.rs` close the Milestone 6 local product gate. Plan 129 is `superseded-by-plan130-final-gate`."

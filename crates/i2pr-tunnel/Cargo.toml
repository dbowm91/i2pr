[package]
name = "i2pr-tunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Runtime-neutral tunnel identity, exploratory pool, and reply-path provider for i2pr"
publish = false

[dependencies]
chacha20.workspace = true
chacha20poly1305.workspace = true
i2pr-core = { path = "../i2pr-core" }
i2pr-crypto = { path = "../i2pr-crypto" }
i2pr-netdb = { path = "../i2pr-netdb" }
i2pr-proto = { path = "../i2pr-proto" }
rand_core = { workspace = true, features = ["os_rng"] }
sha2.workspace = true
thiserror.workspace = true
x25519-dalek = { workspace = true, features = ["static_secrets"] }
zeroize.workspace = true

[dev-dependencies]
aes = { workspace = true }
rand_chacha.workspace = true
rand_core = { workspace = true, features = ["std"] }
x25519-dalek = { workspace = true, features = ["static_secrets"] }

[lints]
workspace = true

[package]
name = "i2pr-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The non-networked i2pr CLI and future daemon composition root"
publish = false

[dependencies]
clap.workspace = true
i2pr-api = { path = "../i2pr-api" }
i2pr-client = { path = "../i2pr-client" }
i2pr-crypto = { path = "../i2pr-crypto" }
i2pr-core = { path = "../i2pr-core" }
i2pr-netdb = { path = "../i2pr-netdb" }
i2pr-netdb-persist = { path = "../i2pr-netdb-persist" }
i2pr-proto = { path = "../i2pr-proto" }
i2pr-runtime = { path = "../i2pr-runtime" }
i2pr-storage = { path = "../i2pr-storage" }
i2pr-transport = { path = "../i2pr-transport" }
i2pr-tunnel = { path = "../i2pr-tunnel" }
rand_chacha = "0.9"
rand_core = "0.9"
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
flate2 = { workspace = true }
i2pr-crypto = { path = "../i2pr-crypto" }
i2pr-netdb = { path = "../i2pr-netdb" }
i2pr-proto = { path = "../i2pr-proto" }
i2pr-transport = { path = "../i2pr-transport" }
i2pr-tunnel = { path = "../i2pr-tunnel" }
rand_chacha = "0.9"
rand_core = { version = "0.9", features = ["std", "os_rng"] }
tempfile = "3.14"
x25519-dalek.workspace = true
zeroize.workspace = true

[[bin]]
name = "i2pr"
path = "src/main.rs"

[[example]]
name = "sam_loopback_listener"
path = "examples/sam_loopback_listener.rs"

[lints]
workspace = true

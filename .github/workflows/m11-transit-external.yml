name: M11 transit external interoperability (i2pd)

on:
  workflow_dispatch:
    inputs:
      epoch:
        description: 'Plan 264 per-epoch selector (empty = full-matrix diagnostic-only; otherwise one mandatory epoch: obep | ibgw | participant | reject | obep-data | ibgw-data | receipt | participant-data | replay | expiry | cancel | session-close | restart)'
        required: false
        default: ''
      epoch_pass:
        description: 'Plan 264 per-epoch pass id (1 or 2; two same-SHA passes per epoch close the row)'
        required: false
        default: '1'
      scenario:
        description: 'Plan 265 frozen scenario family (empty = Plan 264 per-epoch/full-matrix diagnostic-only; otherwise ibgw-data | receipt | participant-lifecycle)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  m11-transit-external:
    # Plan 265 fixed-budget mechanism: dispatch once per scenario
    # family. The attempt matrix below is the frozen budget of eight
    # fresh-mesh attempts (no attempt nine); each attempt checks out
    # the same github.sha, gets its own datadirs/ports/evidence
    # root, and maps to exactly one manifest. Ordinals are fixed
    # before dispatch, so completion order never changes them. An
    # empty scenario input stays the Plan 264 per-epoch /
    # full-matrix diagnostic-only lane (never counted).
    name: M11 exact-pinned i2pd controlled transit (Ubuntu, ${{ inputs.scenario || 'diagnostic' }} attempt ${{ matrix.attempt }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Install external-lane build dependencies
        # Plan 257 lane: building the exact-pinned i2pd C++ reference
        # requires system Boost / OpenSSL / zlib headers.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libboost-all-dev libssl-dev zlib1g-dev

      - name: Fetch and verify exact i2pd reference
        # Plan 257 pin: i2pd 2.61.0 @ 635b013a612ff47278ef02acf8580a28e10e26c5
        run: bash scripts/interop/fetch-ssu2-reference.sh --rebuild

      - name: Show i2pd build log on failure
        if: failure()
        run: tail -n 100 target/interop/cache/ssu2/i2pd/*/logs/build.log

      - name: Check M11 transit boundaries
        run: bash scripts/check-m11-transit-boundaries.sh

      - name: Check M11 transit qualification evidence integrity
        # Plan 257 §15: static structural checker that binds every
        # mandatory Plan 257 row to a `record_guarded`, `m11_row`,
        # `exact_row`, or `exact_lib_row` invocation in the runner.
        # Routine CI also calls it; the manual workflow re-runs it
        # before any external command so a structural drift is
        # caught fail-closed before we start an i2pd process.
        run: bash scripts/check-m11-transit-qualification-evidence.sh

      - name: Run M11 transit qualification runner
        # Plan 264: the runner verifies exact i2pr HEAD + clean
        # i2pd pin, uses fresh loopback datadirs, disables public
        # reseed/network, executes the selected epoch (or the full
        # matrix diagnostic when inputs.epoch is empty), retains
        # sanitized evidence only, terminates all child process
        # groups, proves cleanup baselines, and fails on any
        # missing/blocked/red mandatory row. Each attempt gets
        # fresh ports/evidences so passes stay independent; each
        # counted epoch needs two same-SHA passes to close.
        run: bash tests/integration/m11-transit/run-i2pd.sh
        env:
          I2PR_M11_ONLY_EPOCH: ${{ inputs.scenario && '' || inputs.epoch }}
          I2PR_M11_EPOCH_PASS: ${{ inputs.epoch_pass }}
          I2PR_M11_SCENARIO: ${{ inputs.scenario }}
          I2PR_M11_EXECUTION_ID: github-${{ github.run_id }}-${{ inputs.scenario || 'diagnostic' }}-attempt-${{ matrix.attempt }}
          I2PR_M11_WORKFLOW_RUN_ID: ${{ github.run_id }}
          I2PR_M11_ATTEMPT: ${{ matrix.attempt }}
          I2PR_M11_DATADIR_ID: github-${{ github.run_id }}-${{ inputs.scenario || 'diagnostic' }}-attempt-${{ matrix.attempt }}
          I2PR_M11_EVIDENCE_DIR: target/interop/m11-transit-evidence-${{ inputs.scenario || 'diagnostic' }}-attempt-${{ matrix.attempt }}
          # Disjoint loopback ports per ordinal so parallel dispatch
          # never shares a listener (Plan 265 section 10).
          I2PR_M11_PORT: ${{ format('{0}', 44180 + matrix.attempt) }}
          I2PR_I2PD_PORT: ${{ format('{0}', 43980 + matrix.attempt) }}
          I2PR_I2PD_B_PORT: ${{ format('{0}', 44080 + matrix.attempt) }}
          I2PR_I2PD_SAM_PORT: ${{ format('{0}', 44980 + matrix.attempt) }}
          I2PR_I2PD_B_SAM_PORT: ${{ format('{0}', 45080 + matrix.attempt) }}

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m11-transit-evidence-${{ inputs.scenario || 'diagnostic' }}-attempt-${{ matrix.attempt }}-${{ github.run_id }}
          path: target/interop/m11-transit-evidence-${{ inputs.scenario || 'diagnostic' }}-attempt-${{ matrix.attempt }}
          if-no-files-found: warn

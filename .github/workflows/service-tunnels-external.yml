name: Service-tunnels external interoperability (Plans 213/214)

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Evidence lane: 'local-only' (retained local matrix), 'router-generic' (Plan 213 generic qualification only), or 'full' (default, Plan 213 generic qualification then the Plan 214 HTTP/IRC application requalification through the M10 matrix)"
        required: false
        default: "full"

permissions:
  contents: read

jobs:
  service-tunnels-external:
    name: M10 remote generic + application interop (Plans 213/214, Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Install external-lane build dependencies
        # Declared sudo exception (cf. Plan 161 lane): building the
        # exact-pinned i2pd C++ reference absolutely requires system
        # Boost/OpenSSL/zlib headers; netcat provides the `nc`
        # generic client; everything else runs unprivileged.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libboost-all-dev libssl-dev zlib1g-dev \
            netcat-openbsd

      - name: Fetch and verify exact jaraco/irc client
        run: bash scripts/interop/fetch-service-tunnel-clients.sh

      - name: Fetch and verify exact i2pd reference
        run: bash scripts/interop/fetch-ssu2-reference.sh --rebuild

      - name: Show i2pd build log on failure
        if: failure()
        run: tail -n 100 target/interop/cache/ssu2/i2pd/*/logs/build.log

      - name: Check service-tunnel acceptance evidence integrity
        run: bash scripts/check-service-tunnel-acceptance-evidence.sh

      - name: Run Plan 213 router-backed generic qualification
        if: github.event.inputs.lane == 'router-generic' || github.event.inputs.lane == 'full'
        run: bash tests/integration/service-tunnels/run-plan213-generic.sh
        env:
          I2PR_M10_EXECUTION_ID: github-${{ github.run_id }}

      - name: Run M10 independent application/service matrix (delegates Plan 214 remote qualification)
        if: github.event.inputs.lane != 'router-generic'
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.lane }}" == "local-only" ]]; then
            bash tests/integration/service-tunnels/run-independent.sh --local-only
          else
            # Plan 214 §21 hosted gate order: Plan 213 generic
            # qualification (previous step) -> Plan 214 HTTP
            # qualification -> Plan 214 IRC qualification ->
            # final evidence-integrity check. The M10 matrix
            # delegates its remote rows to
            # run-plan214-applications.sh, which enforces that
            # order and records exactly one P214-* terminal
            # classification.
            bash tests/integration/service-tunnels/run-independent.sh
          fi
        env:
          I2PR_M10_EXECUTION_ID: github-${{ github.run_id }}

      - name: Final service-tunnel evidence-integrity check (Plan 214 §21 gate)
        if: github.event.inputs.lane == 'full'
        run: bash scripts/check-service-tunnel-acceptance-evidence.sh

      - name: Upload sanitized M10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-tunnels-external-evidence-${{ github.run_id }}
          path: target/interop/service-tunnels-evidence
          if-no-files-found: warn

      - name: Upload sanitized Plan 213 generic evidence
        if: always() && (github.event.inputs.lane == 'router-generic' || github.event.inputs.lane == 'full')
        uses: actions/upload-artifact@v4
        with:
          name: plan213-generic-evidence-${{ github.run_id }}
          path: target/interop/plan213-generic-evidence
          if-no-files-found: warn

      # Plan 215 §16 — the qualified Plan 214 evidence is the
      # `plan214/` subdirectory that `run-independent.sh` retains
      # under the umbrella `service-tunnels-evidence/` directory
      # (`I2PR_PLAN214_EVIDENCE_DIR="${EVIDENCE_DIR}/plan214"`). The
      # runner's standalone default path (`plan214-applications-evidence`)
      # is only populated when the runner is invoked directly outside
      # the workflow; the hosted `full` lane always delegates through
      # `run-independent.sh`, so the umbrella-retained path is the
      # authenticated retained path the hosted artifact must capture.
      # `if-no-files-found: error` enforces the packaging contract:
      # a successful `full` lane MUST populate the qualified
      # evidence directory; silently warning away the failure would
      # mask a runner-side regression that drops the qualification
      # evidence.
      - name: Upload sanitized Plan 214 application evidence (umbrella-retained path)
        if: always() && github.event.inputs.lane == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: plan214-applications-evidence-${{ github.run_id }}
          path: target/interop/service-tunnels-evidence/plan214
          if-no-files-found: error

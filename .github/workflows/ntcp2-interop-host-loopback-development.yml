name: NTCP2 host-loopback live-wire evidence (Plan 099 manual)

# Plan 099 manual CI live-wire evidence lane.
#
# The Plan 086 host-loopback-development lane is the only path that
# can run on this host. Two ordinary userspace processes over literal
# IPv4 loopback suffice. The live job must not use privileged
# operations or namespace manipulation; the build steps may install
# declared packages via the runner's ordinary package mechanism.
#
# This workflow must:
# - use only the standard github-hosted ubuntu-24.04 image;
# - keep the live steps free of privileged operations;
# - never advertise NTCP2 support;
# - never enable the normal daemon NTCP2 surface;
# - never publish RouterInfo, reseed, bootstrap, or use DNS;
# - fail closed with a typed CI environment blocker when ordinary
#   loopback processes cannot run.
#
# Plan 099 collapses the prior multi-job build/artifact-transfer
# graph into a single build-and-run job. Build and execute in the
# same fresh workspace. No actions/upload-artifact or
# actions/download-artifact cycles for binaries. No separate
# contract/build/instrumented/control/validate jobs. The final
# sanitized compact summary is the only retained evidence.

on:
  workflow_dispatch:
    # Intentionally no pull_request target. Live NTCP2 interop
    # execution must never be automatic on forked pull requests.

permissions:
  contents: read

concurrency:
  group: ntcp2-host-loopback-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  development-interop:
    name: Plan 099 host-loopback development interop
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Plan 099 single-job canonical paths. Every producer, verifier,
      # manifest, and live consumer resolves against the same absolute
      # directory; no step relies on inherited step working directory
      # to establish artifact identity.
      PLAN099_BUILD_DIR: "${{ github.workspace }}/target/interop/plan099-build"
      PLAN099_OUTPUT: "${{ github.workspace }}/target/interop/plan099-build/output"
      PLAN099_SANITIZED: "${{ github.workspace }}/target/interop/plan099-evidence"
      PLAN099_I2PD_REVISION: "f618e417dbd0b7c5956af8f0d5a6b0ee78caf35e"
      PLAN099_TOPOLOGY: "host-loopback-development"
      PLAN099_NETWORK_ID: "99"
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: rust-toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: install-build-deps
        # Plan 099: package installation is the only declared sudo
        # exception; the live steps run without privilege escalation.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libboost-all-dev libssl-dev zlib1g-dev \
            ca-certificates git openssl ripgrep

      - name: prepare-build-dirs
        run: |
          set -euo pipefail
          mkdir -p "$PLAN099_BUILD_DIR/i2pr-target"
          mkdir -p "$PLAN099_OUTPUT"

      - name: fetch-pinned-i2pd-source
        run: |
          set -euo pipefail
          cd "$PLAN099_BUILD_DIR"
          if [[ ! -d i2pd/.git ]]; then
            git clone --filter=blob:none --no-checkout \
              https://github.com/PurpleI2P/i2pd.git i2pd
          fi
          git -C i2pd fetch --depth=1 origin "$PLAN099_I2PD_REVISION"
          git -C i2pd checkout --detach "$PLAN099_I2PD_REVISION"
          git -C i2pd rev-parse HEAD

      - name: verify-pinned-revision
        run: |
          set -euo pipefail
          cd "$PLAN099_BUILD_DIR"
          test "$(git -C i2pd rev-parse HEAD)" = "$PLAN099_I2PD_REVISION"
          if [[ -n "$(git -C i2pd status --porcelain --untracked-files=no)" ]]; then
            echo "pinned i2pd worktree is dirty; refusing to build" >&2
            exit 70
          fi

      - name: build-i2pd-driver
        run: |
          set -euo pipefail
          cd "$PLAN099_BUILD_DIR"
          bash "${{ github.workspace }}/tests/integration/ntcp2/reference-drivers/i2pd/build-driver.sh" \
            --repo-root "${{ github.workspace }}" \
            --i2pd-source-dir i2pd \
            --output-dir output

      - name: build-i2pr-interop
        run: |
          set -euo pipefail
          cargo +1.95.0 build \
            --manifest-path "${GITHUB_WORKSPACE}/Cargo.toml" \
            --target-dir "$PLAN099_BUILD_DIR/i2pr-target" \
            --locked \
            --release \
            --bin i2pr-interop
          cp "$PLAN099_BUILD_DIR/i2pr-target/release/i2pr-interop" \
             "$PLAN099_OUTPUT/i2pr-interop"
          chmod 0755 "$PLAN099_OUTPUT/i2pr-interop"
          test -f "$PLAN099_OUTPUT/i2pr-interop"
          test -x "$PLAN099_OUTPUT/i2pr-interop"
          test ! -L "$PLAN099_OUTPUT/i2pr-interop"

      - name: verify-build-artifacts
        run: |
          set -euo pipefail
          test -x "$PLAN099_OUTPUT/i2pr-interop"
          test -x "$PLAN099_OUTPUT/i2pd_ntcp2_interop_driver_instrumented"
          test -x "$PLAN099_OUTPUT/i2pd_ntcp2_interop_driver_control"
          test -f "$PLAN099_OUTPUT/build-manifest-instrumented.json"
          test -f "$PLAN099_OUTPUT/build-manifest-control.json"

      - name: focused-local-tests
        # Plan 099 WP6: only the bounded functional test set runs in
        # the live lane. The full historical plan-specific matrix is
        # not executed by the development lane; it remains available
        # via git history for forensic archaeology.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/integration/ntcp2/harness -p 'test_i2pd_direct_driver.py' 2>&1 | tail -n 5
          python3 -m unittest discover -s tests/integration/ntcp2/harness -p 'test_minimal_i2pd_probe.py' 2>&1 | tail -n 5

      - name: prepare-sanitized-dir
        run: |
          set -euo pipefail
          rm -rf "$PLAN099_SANITIZED"
          mkdir -p "$PLAN099_SANITIZED"

      - name: forward-instrumented
        id: forward_instrumented
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf "$PLAN099_BUILD_DIR/run-instrumented"
          python3 scripts/interop/run-minimal-i2pd-host-loopback-probe.py \
            --direction i2pr-to-i2pd-ipv4 \
            --repo-root "${{ github.workspace }}" \
            --run-root "$PLAN099_BUILD_DIR/run-instrumented" \
            --run-id "plan099-instrumented-${{ github.run_id }}" \
            --source-commit "${{ github.sha }}" \
            --output "$PLAN099_BUILD_DIR/run-instrumented/forward-record.json" \
            --i2pd-driver-binary "$PLAN099_OUTPUT/i2pd_ntcp2_interop_driver_instrumented" \
            --i2pr-binary "$PLAN099_OUTPUT/i2pr-interop" \
            --attempt-kind instrumented \
            --delivery-status-message-id "0x04200951"
          instrumented_rc=$?
          echo "instrumented attempt exit: ${instrumented_rc}"
          exit ${instrumented_rc}

      - name: forward-control
        id: forward_control
        continue-on-error: true
        if: steps.forward_instrumented.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf "$PLAN099_BUILD_DIR/run-control"
          python3 scripts/interop/run-minimal-i2pd-host-loopback-probe.py \
            --direction i2pr-to-i2pd-ipv4 \
            --repo-root "${{ github.workspace }}" \
            --run-root "$PLAN099_BUILD_DIR/run-control" \
            --run-id "plan099-control-${{ github.run_id }}" \
            --source-commit "${{ github.sha }}" \
            --output "$PLAN099_BUILD_DIR/run-control/forward-record.json" \
            --i2pd-driver-binary "$PLAN099_OUTPUT/i2pd_ntcp2_interop_driver_control" \
            --i2pr-binary "$PLAN099_OUTPUT/i2pr-interop" \
            --attempt-kind control \
            --delivery-status-message-id "0x04200952"
          control_rc=$?
          echo "control attempt exit: ${control_rc}"
          exit ${control_rc}

      - name: reverse-instrumented
        id: reverse_instrumented
        continue-on-error: true
        if: steps.forward_control.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf "$PLAN099_BUILD_DIR/run-reverse-instrumented"
          python3 scripts/interop/run-minimal-i2pd-host-loopback-probe.py \
            --direction i2pd-to-i2pr-ipv4 \
            --repo-root "${{ github.workspace }}" \
            --run-root "$PLAN099_BUILD_DIR/run-reverse-instrumented" \
            --run-id "plan099-reverse-instrumented-${{ github.run_id }}" \
            --source-commit "${{ github.sha }}" \
            --output "$PLAN099_BUILD_DIR/run-reverse-instrumented/reverse-record.json" \
            --i2pd-driver-binary "$PLAN099_OUTPUT/i2pd_ntcp2_interop_driver_instrumented" \
            --i2pr-binary "$PLAN099_OUTPUT/i2pr-interop" \
            --attempt-kind instrumented \
            --delivery-status-message-id "0x04200953"
          rev_inst_rc=$?
          echo "reverse instrumented attempt exit: ${rev_inst_rc}"
          exit ${rev_inst_rc}

      - name: reverse-control
        id: reverse_control
        continue-on-error: true
        if: steps.reverse_instrumented.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf "$PLAN099_BUILD_DIR/run-reverse-control"
          python3 scripts/interop/run-minimal-i2pd-host-loopback-probe.py \
            --direction i2pd-to-i2pr-ipv4 \
            --repo-root "${{ github.workspace }}" \
            --run-root "$PLAN099_BUILD_DIR/run-reverse-control" \
            --run-id "plan099-reverse-control-${{ github.run_id }}" \
            --source-commit "${{ github.sha }}" \
            --output "$PLAN099_BUILD_DIR/run-reverse-control/reverse-record.json" \
            --i2pd-driver-binary "$PLAN099_OUTPUT/i2pd_ntcp2_interop_driver_control" \
            --i2pr-binary "$PLAN099_OUTPUT/i2pr-interop" \
            --attempt-kind control \
            --delivery-status-message-id "0x04200954"
          rev_ctrl_rc=$?
          echo "reverse control attempt exit: ${rev_ctrl_rc}"
          exit ${rev_ctrl_rc}

      - name: emit-compact-summary
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          HERE = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          sys.path.insert(0, str(HERE / "tests/integration/ntcp2/harness"))

          from plan099_exit_gate import (  # noqa: E402
              ATTEMPT_SLOTS,
              ENVIRONMENT_OR_HARNESS_BLOCKED,
              PROTOCOL_STAGE_THRESHOLD,
              build_summary,
              validate_summary,
          )

          output = pathlib.Path(os.environ["PLAN099_OUTPUT"])
          sanitized = pathlib.Path(os.environ["PLAN099_SANITIZED"])
          build_dir = pathlib.Path(os.environ["PLAN099_BUILD_DIR"])

          def sha256_file(path: pathlib.Path) -> str:
              if not path.is_file():
                  return "0" * 64
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def load_or_blocked(label: str, run_dir_name: str) -> dict[str, object]:
              record_path = build_dir / run_dir_name / (
                  "forward-record.json" if "reverse" not in run_dir_name
                  else "reverse-record.json"
              )
              if not record_path.is_file():
                  return {
                      "present": False,
                      "label": label,
                      "terminal_result": ENVIRONMENT_OR_HARNESS_BLOCKED,
                      "cleanup_result": "not-run",
                  }
              try:
                  data = json.loads(record_path.read_text(encoding="utf-8"))
                  data["present"] = True
                  data["label"] = label
                  return data
              except json.JSONDecodeError:
                  return {
                      "present": False,
                      "label": label,
                      "terminal_result": ENVIRONMENT_OR_HARNESS_BLOCKED,
                      "cleanup_result": "not-run",
                  }

          forward_instrumented = load_or_blocked(
              "forward-instrumented", "run-instrumented"
          )
          forward_control = load_or_blocked("forward-control", "run-control")
          reverse_instrumented = load_or_blocked(
              "reverse-instrumented", "run-reverse-instrumented"
          )
          reverse_control = load_or_blocked(
              "reverse-control", "run-reverse-control"
          )

          attempt_records = {
              ATTEMPT_SLOTS[0]: forward_instrumented,
              ATTEMPT_SLOTS[1]: forward_control,
              ATTEMPT_SLOTS[2]: reverse_instrumented,
              ATTEMPT_SLOTS[3]: reverse_control,
          }

          summary = build_summary(
              workflow_run_id=os.environ["GITHUB_RUN_ID"],
              workflow_run_attempt=int(os.environ["GITHUB_RUN_ATTEMPT"]),
              source_commit=os.environ["GITHUB_SHA"],
              runner_label="ubuntu-24.04",
              runner_arch="x86_64",
              reference_revision=os.environ["PLAN099_I2PD_REVISION"],
              topology_kind=os.environ["PLAN099_TOPOLOGY"],
              network_id=int(os.environ["PLAN099_NETWORK_ID"]),
              bind_address="127.0.0.1",
              development_only=True,
              release_qualified=False,
              isolation_qualified=False,
              i2pr_binary_sha256=sha256_file(output / "i2pr-interop"),
              i2pd_instrumented_binary_sha256=sha256_file(
                  output / "i2pd_ntcp2_interop_driver_instrumented"
              ),
              i2pd_control_binary_sha256=sha256_file(
                  output / "i2pd_ntcp2_interop_driver_control"
              ),
              forward_instrumented=forward_instrumented,
              forward_control=forward_control,
              reverse_instrumented=reverse_instrumented,
              reverse_control=reverse_control,
              ntcp2="experimental-non-advertised",
              attempt_records=attempt_records,
          )
          validate_summary(summary)
          sanitized.mkdir(parents=True, exist_ok=True)
          out = sanitized / "plan099-summary.json"
          out.write_text(
              json.dumps(summary, sort_keys=True, indent=2), encoding="utf-8"
          )
          print(f"summary written: {out}")
          print(f"summary_sha256: {summary['summary_sha256']}")
          print(f"status: {summary['status']}")
          PY

      - name: delete-raw-run-state
        if: always()
        run: |
          set -euo pipefail
          # Plan 099 WP3: destructive cleanup of every disposable run
          # root created during the live steps. The sanitized summary
          # tree survives; nothing else is retained.
          case "$PLAN099_BUILD_DIR" in
            "${{ github.workspace }}/target/interop/plan099-build") ;;
            *) echo "refusing unexpected build dir: $PLAN099_BUILD_DIR" >&2; exit 72 ;;
          esac
          for run_dir in run-instrumented run-control \
                         run-reverse-instrumented run-reverse-control; do
            target="$PLAN099_BUILD_DIR/$run_dir"
            if [[ -d "$target" ]]; then
              rm -rf -- "$target"
              test ! -e "$target"
            fi
          done

      - name: upload-summary
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: plan099-summary
          path: ${{ github.workspace }}/target/interop/plan099-evidence/plan099-summary.json
          if-no-files-found: error
          retention-days: 14
name: NTCP2 host-loopback live-wire evidence (Plan 095 manual)

# Plan 095 manual CI live-wire evidence lane.
#
# The Plan 086 host-loopback-development lane is the only path that
# can run on this host. Two ordinary userspace processes over literal
# IPv4 loopback suffice. The live jobs must not use privileged
# operations or namespace manipulation; the build job may install
# declared packages via the runner's ordinary package manager.
#
# This workflow must:
# - use only the standard github-hosted ubuntu-24.04 image;
# - keep the live jobs free of privileged operations;
# - never advertise NTCP2 support;
# - never enable the normal daemon NTCP2 surface;
# - never publish RouterInfo, reseed, bootstrap, or use DNS;
# - fail closed with a typed CI environment blocker when ordinary
#   loopback processes cannot run.
#
# The contract job runs the static/repository-boundary surface only.
# The build job produces the i2pr binary, the instrumented i2pd
# direct driver, and the control/pristine i2pd direct driver from
# exact immutable source/build inputs. The forward-instrumented
# job runs exactly one fresh forward attempt. The forward-control
# job runs exactly one fresh forward attempt only after the
# instrumented evidence independently validates. The validate-gate
# job verifies both records and emits the Plan 095 CI gate record.

on:
  workflow_dispatch:
    # Intentionally no pull_request target. Live NTCP2 interop
    # execution must never be automatic on forked pull requests.

permissions:
  contents: read

concurrency:
  group: ntcp2-host-loopback-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Plan 095 contract gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4.1.7
      - name: rust-toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: cargo-fmt
        run: cargo +1.95.0 fmt --all --check
      - name: cargo-check
        run: cargo +1.95.0 check --locked --workspace --all-targets
      - name: cargo-test
        run: cargo +1.95.0 test --locked --workspace
      - name: cargo-clippy
        run: cargo +1.95.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo +1.95.0 doc --locked --workspace --no-deps
      - name: dependency-direction
        run: bash scripts/check-dependency-direction.sh
      - name: runtime-boundaries
        run: bash scripts/check-runtime-boundaries.sh
      - name: ntcp2-vectors
        run: bash scripts/check-ntcp2-vectors.sh
      - name: ntcp2-interoperability
        run: bash scripts/check-ntcp2-interoperability.sh
      - name: rootless-boundary
        run: bash scripts/check-rootless-interop-boundary.sh
      - name: install-rg
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep
      - name: multipass-boundary
        run: bash scripts/check-multipass-interop-boundary.sh
      - name: plan095-contract-tests
        run: python3 -m unittest discover -s tests/integration/ntcp2/harness -p 'test_plan095.py'
      - name: plan096-workflow-tests
        run: python3 -m unittest discover -s tests/integration/ntcp2/harness -p 'test_plan096.py'
      - name: plan097-artifact-cleanup-tests
        run: python3 -m unittest discover -s tests/integration/ntcp2/harness -p 'test_plan097.py'
      - name: plan094-regression-tests
        run: python3 -m unittest discover -s tests/integration/ntcp2/harness -p 'test_plan094.py'
      - name: plan093-regression-tests
        run: python3 -m unittest discover -s tests/integration/ntcp2/harness -p 'test_plan093.py'
      - name: plan083-runner-tests
        run: python3 -m unittest discover -s tests/integration/ntcp2/harness -p 'test_plan083_runner.py'
      - name: i2pd-driver-tests
        run: python3 -m unittest discover -s tests/integration/ntcp2/harness -p 'test_i2pd_direct_driver.py'
      - name: i2pd-control-tests
        run: python3 -m unittest discover -s tests/integration/ntcp2/harness -p 'test_i2pd_direct_control.py'
      - name: plan088-tests
        run: python3 -m unittest discover -s tests/integration/ntcp2/harness -p 'test_plan088.py'

  build:
    name: Plan 095 deterministic build
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@v4.1.7
      - name: rust-toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: install-build-deps
        # Plan 095: package installation is the only declared sudo
        # exception; the live jobs run without privilege escalation.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libboost-all-dev libssl-dev zlib1g-dev \
            ca-certificates git openssl ripgrep
      - name: fetch-pinned-i2pd-source
        env:
          I2PD_REVISION: "f618e417dbd0b7c5956af8f0d5a6b0ee78caf35e"
          BUILD_DIR: "${{ github.workspace }}/target/interop/plan095-build"
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          if [[ ! -d i2pd/.git ]]; then
            git clone --filter=blob:none --no-checkout \
              https://github.com/PurpleI2P/i2pd.git i2pd
          fi
          git -C i2pd fetch --depth=1 origin "$I2PD_REVISION"
          git -C i2pd checkout --detach "$I2PD_REVISION"
          git -C i2pd rev-parse HEAD
      - name: verify-pinned-revision
        env:
          BUILD_DIR: "${{ github.workspace }}/target/interop/plan095-build"
          I2PD_REVISION: "f618e417dbd0b7c5956af8f0d5a6b0ee78caf35e"
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          test "$(git -C i2pd rev-parse HEAD)" = "$I2PD_REVISION"
          if [[ -n "$(git -C i2pd status --porcelain --untracked-files=no)" ]]; then
            echo "pinned i2pd worktree is dirty; refusing to build" >&2
            exit 70
          fi
      - name: record-source-tree-digest
        env:
          BUILD_DIR: "${{ github.workspace }}/target/interop/plan095-build"
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          # Plan 096: canonical tracked-source digest excludes the
          # ``.git`` administrative tree and any build/worktree
          # metadata. The digest covers the pinned tracked file paths
          # and content of the i2pd 2.60.0 source tree.
          git -C i2pd ls-files -z \
            | while IFS= read -r -d '' path; do
                printf '%s\0' "$path"
                sha256sum "i2pd/$path" | awk '{printf "%s\0", $1}'
              done \
            | sha256sum \
            | awk '{print $1}' > i2pd-source-tree.sha256
          cat i2pd-source-tree.sha256
      - name: build-i2pd-driver
        env:
          BUILD_DIR: "${{ github.workspace }}/target/interop/plan095-build"
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          mkdir -p output
          bash "${{ github.workspace }}/tests/integration/ntcp2/reference-drivers/i2pd/build-driver.sh" \
            --repo-root "${{ github.workspace }}" \
            --i2pd-source-dir i2pd \
            --output-dir output
      - name: build-i2pr-interop
        env:
          BUILD_DIR: "${{ github.workspace }}/target/interop/plan095-build"
        run: |
          set -euo pipefail
          # Plan 097: the i2pr artifact must travel through one
          # canonical absolute path. ``BUILD_OUTPUT`` is the single
          # directory every producer and consumer resolves against.
          # No step relies on inherited step working directory to
          # establish artifact identity.
          I2PR_TARGET_DIR="$BUILD_DIR/i2pr-target"
          BUILD_OUTPUT="$BUILD_DIR/output"
          mkdir -p "$I2PR_TARGET_DIR"
          mkdir -p "$BUILD_OUTPUT"
          cargo +1.95.0 build \
            --manifest-path "${GITHUB_WORKSPACE}/Cargo.toml" \
            --target-dir "$I2PR_TARGET_DIR" \
            --locked \
            --release \
            --bin i2pr-interop
          cp "$I2PR_TARGET_DIR/release/i2pr-interop" \
             "$BUILD_OUTPUT/i2pr-interop"
          test -f "$BUILD_OUTPUT/i2pr-interop"
          test -x "$BUILD_OUTPUT/i2pr-interop"
          test ! -L "$BUILD_OUTPUT/i2pr-interop"
      - name: hash-i2pr-build-manifest
        env:
          BUILD_DIR: "${{ github.workspace }}/target/interop/plan095-build"
        run: |
          set -euo pipefail
          # Plan 097: the manifest must hash the exact canonical
          # artifact at the canonical absolute path. No CWD
          # inference; the producer, verifier, manifest, and uploader
          # all resolve to the same absolute path.
          BUILD_OUTPUT="$BUILD_DIR/output"
          test -f "$BUILD_OUTPUT/i2pr-interop"
          test -x "$BUILD_OUTPUT/i2pr-interop"
          test ! -L "$BUILD_OUTPUT/i2pr-interop"
          cat > "$BUILD_OUTPUT/i2pr-build-manifest.json" <<EOF
          {
            "schema": "i2pr-i2pr-interop-build-manifest-v1",
            "schema_version": 1,
            "source_commit": "${{ github.sha }}",
            "source_tree_clean": true,
            "cargo_lock_sha256": "$(sha256sum "${{ github.workspace }}/Cargo.lock" | awk '{print $1}')",
            "i2pr_binary_sha256": "$(sha256sum "$BUILD_OUTPUT/i2pr-interop" | awk '{print $1}')",
            "rust_toolchain": "1.95.0",
            "build_command_version": "cargo-build-release-v1",
            "build_timestamp_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: verify-build-artifacts
        env:
          BUILD_DIR: "${{ github.workspace }}/target/interop/plan095-build"
        run: |
          set -euo pipefail
          # Plan 097: every verification path resolves to the
          # canonical absolute output directory. No CWD inference;
          # if any required artifact is missing the step exits
          # non-zero and the build job fails closed.
          BUILD_OUTPUT="$BUILD_DIR/output"
          ls -la "$BUILD_OUTPUT"
          test -x "$BUILD_OUTPUT/i2pr-interop"
          test -x "$BUILD_OUTPUT/i2pd_ntcp2_interop_driver_instrumented"
          test -x "$BUILD_OUTPUT/i2pd_ntcp2_interop_driver_control"
          test -f "$BUILD_OUTPUT/i2pr-build-manifest.json"
          test -f "$BUILD_OUTPUT/build-manifest-instrumented.json"
          test -f "$BUILD_OUTPUT/build-manifest-control.json"
          test -f "$BUILD_OUTPUT/linked-library-manifest.txt"
          test -f "$BUILD_OUTPUT/inspect-instrumented.json"
          test -f "$BUILD_OUTPUT/inspect-control.json"
          python3 -c "
          import json
          for path in ['$BUILD_OUTPUT/i2pr-build-manifest.json',
                       '$BUILD_OUTPUT/build-manifest-instrumented.json',
                       '$BUILD_OUTPUT/build-manifest-control.json',
                       '$BUILD_OUTPUT/inspect-instrumented.json',
                       '$BUILD_OUTPUT/inspect-control.json']:
              with open(path, 'r', encoding='utf-8') as handle:
                  data = json.load(handle)
              assert isinstance(data, dict), path
              for key, value in data.items():
                  if 'sha256' in key.lower() or 'digest' in key.lower():
                      if not isinstance(value, str) or not value:
                          raise SystemExit(f'nonempty string required at {path}:{key}')
                      # The ``i2pd_libraries_sha256`` field is a
                      # space-separated concatenation of three
                      # library digests (libi2pd, libi2pdclient,
                      # libi2pdlang); every fragment must be a
                      # nonzero 64-hex digest. Other fields carry a
                      # single nonzero 64-hex digest.
                      fragments = value.split(' ')
                      if not fragments or any(not frag for frag in fragments):
                          raise SystemExit(f'empty fragment in digest at {path}:{key}')
                      for frag in fragments:
                          if len(frag) != 64 or frag == '0' * 64:
                              raise SystemExit(f'nonzero 64-hex digest required at {path}:{key}: fragment {frag!r}')
          print('all build manifests validate')
          "
      - name: upload-build-artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: plan095-build
          path: ${{ github.workspace }}/target/interop/plan095-build/output/
          if-no-files-found: error
          retention-days: 7

  forward-instrumented:
    name: Plan 095 forward instrumented
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4.1.7
      - name: rust-toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: download-build-artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: plan095-build
          path: ${{ github.workspace }}/target/interop/plan095-build/output/
      - name: prepare-run-root
        env:
          # Plan 096: the sanitized evidence tree must be disjoint
          # from the disposable run root. Raw runtime state lives
          # under ``plan095-instrumented`` and is deleted before
          # the artifact upload step. Sanitized evidence lives
          # under ``plan095-evidence/instrumented`` and is
          # preserved across the cleanup step.
          PLAN095_RUN_ROOT: "${{ github.workspace }}/target/interop/plan095-instrumented"
          PLAN095_SANITIZED: "${{ github.workspace }}/target/interop/plan095-evidence/instrumented"
        run: |
          set -euo pipefail
          rm -rf "$PLAN095_RUN_ROOT"
          rm -rf "$PLAN095_SANITIZED"
          mkdir -p "$PLAN095_RUN_ROOT"
          mkdir -p "$PLAN095_SANITIZED"
          # Fail closed if the sanitized tree is a descendant of the
          # disposable run root. The contract is structural, not
          # semantic; this guards against future drift.
          case "$PLAN095_SANITIZED" in
            "$PLAN095_RUN_ROOT"/*) echo "sanitized path is descendant of run root" >&2; exit 71 ;;
          esac
      - name: emit-environment-blocker-on-build-missing
        run: |
          set -euo pipefail
          build_root="${{ github.workspace }}/target/interop/plan095-build/output"
          if [[ ! -x "$build_root/i2pr-interop" \
              || ! -x "$build_root/i2pd_ntcp2_interop_driver_instrumented" ]]; then
            echo "ci_build_blocked: build artifact missing" >&2
            exit 73
          fi
      - name: run-forward-instrumented
        id: run_instrumented
        continue-on-error: true
        env:
          PLAN095_RUN_ROOT: "${{ github.workspace }}/target/interop/plan095-instrumented"
          PLAN095_RECORD: "${{ github.workspace }}/target/interop/plan095-instrumented/forward-record.json"
          I2PD_DRIVER_BINARY: "${{ github.workspace }}/target/interop/plan095-build/output/i2pd_ntcp2_interop_driver_instrumented"
          I2PR_BINARY: "${{ github.workspace }}/target/interop/plan095-build/output/i2pr-interop"
        run: |
          set -euo pipefail
          python3 scripts/interop/run-minimal-i2pd-host-loopback-probe.py \
            --direction i2pr-to-i2pd-ipv4 \
            --repo-root "${{ github.workspace }}" \
            --run-root "$PLAN095_RUN_ROOT" \
            --run-id "plan095-instrumented-${{ github.run_id }}" \
            --source-commit "${{ github.sha }}" \
            --output "$PLAN095_RECORD" \
            --i2pd-driver-binary "$I2PD_DRIVER_BINARY" \
            --i2pr-binary "$I2PR_BINARY" \
            --delivery-status-message-id "0x04200951" \
          instrumented_rc=$?
          echo "instrumented attempt exit: ${instrumented_rc}"
          # Plan 096: never silently mask a non-zero instrumented
          # exit. Record the exit so the validate step can require
          # an evidence-pass with explicit ``terminal_result`` =
          # ``passed``; ``|| echo`` cannot make the run a success.
          exit ${instrumented_rc}
      - name: sanitize-record
        if: always()
        env:
          PLAN095_RECORD: "${{ github.workspace }}/target/interop/plan095-instrumented/forward-record.json"
          PLAN095_SANITIZED: "${{ github.workspace }}/target/interop/plan095-evidence/instrumented"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          record_path = pathlib.Path(os.environ["PLAN095_RECORD"])
          sanitized_dir = pathlib.Path(os.environ["PLAN095_SANITIZED"])
          sanitized_dir.mkdir(parents=True, exist_ok=True)
          if not record_path.is_file():
              sanitized = {
                  "schema": "i2pr-ntcp2-plan095-instrumented-record-v1",
                  "attempt_kind": "instrumented",
                  "attempt_index": 1,
                  "direction": "i2pr-to-i2pd-ipv4",
                  "topology_kind": "host-loopback-development",
                  "terminal_result": "blocked-environment-or-build",
                  "cleanup_result": "not-run",
                  "raw_record_present": False,
              }
          else:
              record = json.loads(record_path.read_text(encoding="utf-8"))
              sanitized = {
                  "schema": "i2pr-ntcp2-plan095-instrumented-record-v1",
                  "attempt_kind": record.get("attempt_kind", "instrumented"),
                  "attempt_index": record.get("attempt_index", 1),
                  "direction": record.get("direction", "i2pr-to-i2pd-ipv4"),
                  "topology_kind": record.get("topology_kind", "host-loopback-development"),
                  "source_commit": record.get("source_commit", ""),
                  "reference_revision": record.get("reference_revision", ""),
                  "network_id": record.get("network_id", 99),
                  "terminal_result": record.get("terminal_result", ""),
                  "reason_code": record.get("reason_code", ""),
                  "highest_stage_reached": record.get("highest_stage_reached", ""),
                  "i2pr_binary_sha256": record.get("i2pr_binary_sha256", ""),
                  "i2pd_binary_sha256": record.get("i2pd_binary_sha256", ""),
                  "i2pr_build_manifest_sha256": record.get("i2pr_build_manifest_sha256", ""),
                  "i2pd_build_manifest_sha256": record.get("i2pd_build_manifest_sha256", ""),
                  "reference_source_tree_sha256": record.get("reference_source_tree_sha256", ""),
                  "scenario_sha256": record.get("scenario_sha256", ""),
                  "placement_record_sha256": record.get("placement_record_sha256", ""),
                  "cleanup_result": record.get("cleanup_result", ""),
                  "delivery_status_message_id": record.get("delivery_status_message_id", 0),
                  "peer_router_hash_sha256": record.get("peer_router_hash_sha256", ""),
                  "i2pr_router_hash_sha256": record.get("i2pr_router_hash_sha256", ""),
                  "record_sha256": record.get("record_sha256", ""),
              }
          sanitized["sanitized_sha256"] = hashlib.sha256(
              json.dumps(sanitized, sort_keys=True, indent=2).encode()
          ).hexdigest()
          out = sanitized_dir / "forward-instrumented-sanitized.json"
          out.write_text(json.dumps(sanitized, sort_keys=True, indent=2), encoding="utf-8")
          print(f"sanitized record written: {out}")
          print(f"sanitized_sha256: {sanitized['sanitized_sha256']}")
          PY
      - name: delete-raw-run-state
        if: always()
        env:
          PLAN095_RUN_ROOT: "${{ github.workspace }}/target/interop/plan095-instrumented"
          PLAN095_SANITIZED: "${{ github.workspace }}/target/interop/plan095-evidence/instrumented"
        run: |
          set -euo pipefail
          # Plan 097: the disposable run root and every descendant
          # must be absent after cleanup. The deletion is destructive
          # and verified; the absence assertion is not suppressed.
          # The path guard refuses any unexpected cleanup target
          # before any ``rm -rf`` runs.
          case "$PLAN095_RUN_ROOT" in
            "${{ github.workspace }}/target/interop/plan095-instrumented") ;;
            *) echo "refusing unexpected PLAN095_RUN_ROOT: $PLAN095_RUN_ROOT" >&2; exit 72 ;;
          esac
          rm -rf -- "$PLAN095_RUN_ROOT"
          test ! -e "$PLAN095_RUN_ROOT"
          test -d "$PLAN095_SANITIZED" || { echo "sanitized evidence tree was lost" >&2; exit 72; }
          test -f "$PLAN095_SANITIZED/forward-instrumented-sanitized.json" \
            || { echo "sanitized record file was lost" >&2; exit 72; }
          echo "raw run state deleted; sanitized evidence preserved"
      - name: upload-instrumented-evidence
        if: always()
        uses: actions/upload-artifact@v4.4.0
        with:
          name: plan095-instrumented-evidence
          path: ${{ github.workspace }}/target/interop/plan095-evidence/instrumented/
          if-no-files-found: error
          retention-days: 14

  forward-control:
    name: Plan 095 forward control
    needs: [build, forward-instrumented]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4.1.7
      - name: rust-toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: download-build-artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: plan095-build
          path: ${{ github.workspace }}/target/interop/plan095-build/output/
      - name: download-instrumented-evidence
        uses: actions/download-artifact@v4.1.7
        with:
          name: plan095-instrumented-evidence
          path: ${{ github.workspace }}/target/interop/plan095-evidence/instrumented/
      - name: validate-instrumented-evidence
        env:
          INSTRUMENTED_DIR: "${{ github.workspace }}/target/interop/plan095-evidence/instrumented"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          sanitized_dir = pathlib.Path(os.environ["INSTRUMENTED_DIR"])
          files = sorted(sanitized_dir.glob("forward-instrumented-sanitized.json"))
          if not files:
              print("control attempt forbidden: instrumented sanitized record missing", file=sys.stderr)
              sys.exit(74)
          record = json.loads(files[0].read_text(encoding="utf-8"))
          if record.get("terminal_result") != "passed":
              print("control attempt forbidden: instrumented terminal_result != passed", file=sys.stderr)
              sys.exit(75)
          if record.get("cleanup_result") != "clean":
              print("control attempt forbidden: instrumented cleanup != clean", file=sys.stderr)
              sys.exit(76)
          for key in ("i2pr_binary_sha256", "i2pd_binary_sha256",
                      "i2pr_build_manifest_sha256", "i2pd_build_manifest_sha256",
                      "reference_source_tree_sha256", "scenario_sha256",
                      "placement_record_sha256"):
              value = record.get(key, "")
              if not isinstance(value, str) or len(value) != 64 or value == "0" * 64:
                  print(f"control attempt forbidden: instrumented {key} not a nonzero 64-hex digest", file=sys.stderr)
                  sys.exit(77)
          print("instrumented evidence independently validated")
          PY
      - name: prepare-run-root
        env:
          # Plan 096: control sanitized evidence lives outside the
          # disposable control run root for the same reason as the
          # instrumented path.
          PLAN095_RUN_ROOT: "${{ github.workspace }}/target/interop/plan095-control"
          PLAN095_SANITIZED: "${{ github.workspace }}/target/interop/plan095-evidence/control"
        run: |
          set -euo pipefail
          rm -rf "$PLAN095_RUN_ROOT"
          rm -rf "$PLAN095_SANITIZED"
          mkdir -p "$PLAN095_RUN_ROOT"
          mkdir -p "$PLAN095_SANITIZED"
          case "$PLAN095_SANITIZED" in
            "$PLAN095_RUN_ROOT"/*) echo "sanitized path is descendant of run root" >&2; exit 71 ;;
          esac
      - name: emit-environment-blocker-on-build-missing
        run: |
          set -euo pipefail
          build_root="${{ github.workspace }}/target/interop/plan095-build/output"
          if [[ ! -x "$build_root/i2pr-interop" \
              || ! -x "$build_root/i2pd_ntcp2_interop_driver_control" ]]; then
            echo "ci_build_blocked: control build artifact missing" >&2
            exit 73
          fi
      - name: run-forward-control
        id: run_control
        continue-on-error: true
        env:
          PLAN095_RUN_ROOT: "${{ github.workspace }}/target/interop/plan095-control"
          PLAN095_RECORD: "${{ github.workspace }}/target/interop/plan095-control/forward-record.json"
          I2PD_DRIVER_BINARY: "${{ github.workspace }}/target/interop/plan095-build/output/i2pd_ntcp2_interop_driver_control"
          I2PR_BINARY: "${{ github.workspace }}/target/interop/plan095-build/output/i2pr-interop"
        run: |
          set -euo pipefail
          python3 scripts/interop/run-minimal-i2pd-host-loopback-probe.py \
            --direction i2pr-to-i2pd-ipv4 \
            --repo-root "${{ github.workspace }}" \
            --run-root "$PLAN095_RUN_ROOT" \
            --run-id "plan095-control-${{ github.run_id }}" \
            --source-commit "${{ github.sha }}" \
            --output "$PLAN095_RECORD" \
            --i2pd-driver-binary "$I2PD_DRIVER_BINARY" \
            --i2pr-binary "$I2PR_BINARY" \
            --delivery-status-message-id "0x04200952" \
          control_rc=$?
          echo "control attempt exit: ${control_rc}"
          exit ${control_rc}
      - name: sanitize-record
        if: always()
        env:
          PLAN095_RECORD: "${{ github.workspace }}/target/interop/plan095-control/forward-record.json"
          PLAN095_SANITIZED: "${{ github.workspace }}/target/interop/plan095-evidence/control"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          record_path = pathlib.Path(os.environ["PLAN095_RECORD"])
          sanitized_dir = pathlib.Path(os.environ["PLAN095_SANITIZED"])
          sanitized_dir.mkdir(parents=True, exist_ok=True)
          if not record_path.is_file():
              sanitized = {
                  "schema": "i2pr-ntcp2-plan095-control-record-v1",
                  "attempt_kind": "control",
                  "attempt_index": 1,
                  "direction": "i2pr-to-i2pd-ipv4",
                  "topology_kind": "host-loopback-development",
                  "terminal_result": "blocked-environment-or-build",
                  "cleanup_result": "not-run",
                  "raw_record_present": False,
              }
          else:
              record = json.loads(record_path.read_text(encoding="utf-8"))
              sanitized = {
                  "schema": "i2pr-ntcp2-plan095-control-record-v1",
                  "attempt_kind": record.get("attempt_kind", "control"),
                  "attempt_index": record.get("attempt_index", 1),
                  "direction": record.get("direction", "i2pr-to-i2pd-ipv4"),
                  "topology_kind": record.get("topology_kind", "host-loopback-development"),
                  "source_commit": record.get("source_commit", ""),
                  "reference_revision": record.get("reference_revision", ""),
                  "network_id": record.get("network_id", 99),
                  "terminal_result": record.get("terminal_result", ""),
                  "reason_code": record.get("reason_code", ""),
                  "highest_stage_reached": record.get("highest_stage_reached", ""),
                  "i2pr_binary_sha256": record.get("i2pr_binary_sha256", ""),
                  "i2pd_binary_sha256": record.get("i2pd_binary_sha256", ""),
                  "i2pr_build_manifest_sha256": record.get("i2pr_build_manifest_sha256", ""),
                  "i2pd_build_manifest_sha256": record.get("i2pd_build_manifest_sha256", ""),
                  "reference_source_tree_sha256": record.get("reference_source_tree_sha256", ""),
                  "scenario_sha256": record.get("scenario_sha256", ""),
                  "placement_record_sha256": record.get("placement_record_sha256", ""),
                  "cleanup_result": record.get("cleanup_result", ""),
                  "delivery_status_message_id": record.get("delivery_status_message_id", 0),
                  "peer_router_hash_sha256": record.get("peer_router_hash_sha256", ""),
                  "i2pr_router_hash_sha256": record.get("i2pr_router_hash_sha256", ""),
                  "record_sha256": record.get("record_sha256", ""),
              }
          sanitized["sanitized_sha256"] = hashlib.sha256(
              json.dumps(sanitized, sort_keys=True, indent=2).encode()
          ).hexdigest()
          out = sanitized_dir / "forward-control-sanitized.json"
          out.write_text(json.dumps(sanitized, sort_keys=True, indent=2), encoding="utf-8")
          print(f"sanitized record written: {out}")
          print(f"sanitized_sha256: {sanitized['sanitized_sha256']}")
          PY
      - name: delete-raw-run-state
        if: always()
        env:
          PLAN095_RUN_ROOT: "${{ github.workspace }}/target/interop/plan095-control"
          PLAN095_SANITIZED: "${{ github.workspace }}/target/interop/plan095-evidence/control"
        run: |
          set -euo pipefail
          # Plan 097: the disposable run root and every descendant
          # must be absent after cleanup. The deletion is destructive
          # and verified; the absence assertion is not suppressed.
          # The path guard refuses any unexpected cleanup target
          # before any ``rm -rf`` runs.
          case "$PLAN095_RUN_ROOT" in
            "${{ github.workspace }}/target/interop/plan095-control") ;;
            *) echo "refusing unexpected PLAN095_RUN_ROOT: $PLAN095_RUN_ROOT" >&2; exit 72 ;;
          esac
          rm -rf -- "$PLAN095_RUN_ROOT"
          test ! -e "$PLAN095_RUN_ROOT"
          test -d "$PLAN095_SANITIZED" || { echo "sanitized evidence tree was lost" >&2; exit 72; }
          test -f "$PLAN095_SANITIZED/forward-control-sanitized.json" \
            || { echo "sanitized record file was lost" >&2; exit 72; }
          echo "raw run state deleted; sanitized evidence preserved"
      - name: upload-control-evidence
        if: always()
        uses: actions/upload-artifact@v4.4.0
        with:
          name: plan095-control-evidence
          path: ${{ github.workspace }}/target/interop/plan095-evidence/control/
          if-no-files-found: error
          retention-days: 14

  validate-gate:
    name: Plan 095 CI gate validation
    needs: [build, forward-instrumented, forward-control]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4.1.7
      - name: download-build-artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: plan095-build
          path: ${{ github.workspace }}/target/interop/plan095-build/output/
      - name: download-instrumented-evidence
        uses: actions/download-artifact@v4.1.7
        with:
          name: plan095-instrumented-evidence
          path: ${{ github.workspace }}/target/interop/plan095-evidence/instrumented/
      - name: download-control-evidence
        uses: actions/download-artifact@v4.1.7
        with:
          name: plan095-control-evidence
          path: ${{ github.workspace }}/target/interop/plan095-evidence/control/
      - name: emit-ci-gate-record
        env:
          BUILD_DIR: "${{ github.workspace }}/target/interop/plan095-build/output"
          INSTRUMENTED_DIR: "${{ github.workspace }}/target/interop/plan095-evidence/instrumented"
          CONTROL_DIR: "${{ github.workspace }}/target/interop/plan095-evidence/control"
          EVIDENCE_ROOT: "${{ github.workspace }}/target/interop/evidence"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          build_dir = pathlib.Path(os.environ["BUILD_DIR"])
          instrumented_dir = pathlib.Path(os.environ["INSTRUMENTED_DIR"])
          control_dir = pathlib.Path(os.environ["CONTROL_DIR"])
          evidence_root = pathlib.Path(os.environ["EVIDENCE_ROOT"])
          evidence_root.mkdir(parents=True, exist_ok=True)
          gate_path = evidence_root / "plan095-ci-gate.json"

          instrumented_files = sorted(instrumented_dir.glob("forward-instrumented-sanitized.json"))
          control_files = sorted(control_dir.glob("forward-control-sanitized.json"))
          if not instrumented_files:
              print("instrumented sanitized record missing", file=sys.stderr)
              sys.exit(80)
          if not control_files:
              print("control sanitized record missing", file=sys.stderr)
              sys.exit(81)
          instrumented = json.loads(instrumented_files[0].read_text(encoding="utf-8"))
          control = json.loads(control_files[0].read_text(encoding="utf-8"))

          instrumented_passed = (
              instrumented.get("terminal_result") == "passed"
              and instrumented.get("cleanup_result") == "clean"
          )
          control_passed = (
              control.get("terminal_result") == "passed"
              and control.get("cleanup_result") == "clean"
          )
          source_commit_match = (
              instrumented.get("source_commit") == control.get("source_commit")
              == os.environ["GITHUB_SHA"]
          )
          reference_revision_match = (
              instrumented.get("reference_revision")
              == control.get("reference_revision")
              == "f618e417dbd0b7c5956af8f0d5a6b0ee78caf35e"
          )
          instrumented_binary_sha = (
              hashlib.sha256(
                  (build_dir / "i2pd_ntcp2_interop_driver_instrumented").read_bytes()
              ).hexdigest()
              if (build_dir / "i2pd_ntcp2_interop_driver_instrumented").is_file()
              else "0" * 64
          )
          control_binary_sha = (
              hashlib.sha256(
                  (build_dir / "i2pd_ntcp2_interop_driver_control").read_bytes()
              ).hexdigest()
              if (build_dir / "i2pd_ntcp2_interop_driver_control").is_file()
              else "0" * 64
          )
          i2pr_binary_sha = (
              hashlib.sha256(
                  (build_dir / "i2pr-interop").read_bytes()
              ).hexdigest()
              if (build_dir / "i2pr-interop").is_file()
              else "0" * 64
          )

          gate = {
              "schema": "i2pr-ntcp2-plan095-ci-gate-v1",
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_commit": os.environ["GITHUB_SHA"],
              "runner_label": "ubuntu-24.04",
              "runner_arch": "x86_64",
              "reference_revision": "f618e417dbd0b7c5956af8f0d5a6b0ee78caf35e",
              "topology_kind": "host-loopback-development",
              "network_id": 99,
              "bind_address": "127.0.0.1",
              "development_only": True,
              "release_qualified": False,
              "isolation_qualified": False,
              "i2pr_binary_sha256": i2pr_binary_sha,
              "instrumented_binary_sha256": instrumented_binary_sha,
              "control_binary_sha256": control_binary_sha,
              "instrumented_record_sha256": instrumented.get("sanitized_sha256", ""),
              "control_record_sha256": control.get("sanitized_sha256", ""),
              "instrumented_result": "passed" if instrumented_passed else "nonpassing",
              "control_result": "passed" if control_passed else "nonpassing",
              "equivalence": "passed" if (instrumented_passed and control_passed) else "nonpassing",
              "source_commit_match": source_commit_match,
              "reference_revision_match": reference_revision_match,
              "cleanup": "clean" if (instrumented_passed and control_passed) else "nonpassing",
              "plan087_gate": "satisfied" if (instrumented_passed and control_passed) else "blocked",
              "plan088_gate": "ready_after_status_reconciliation" if (instrumented_passed and control_passed) else "blocked",
              "plan079_gate": "blocked_pending_plan088_two_way_pass",
              "plan072_gate": "inactive_pending_plan088_ambiguity",
              "ntcp2": "experimental-non-advertised",
          }
          gate["gate_record_sha256"] = hashlib.sha256(
              json.dumps({k: v for k, v in gate.items() if k != "gate_record_sha256"},
                         sort_keys=True, indent=2).encode()
          ).hexdigest()
          gate_path.write_text(json.dumps(gate, sort_keys=True, indent=2), encoding="utf-8")
          print(f"gate record written: {gate_path}")
          print(f"gate_record_sha256: {gate['gate_record_sha256']}")
          if not (instrumented_passed and control_passed):
              sys.exit(82)
          PY
      - name: upload-gate-record
        if: always()
        uses: actions/upload-artifact@v4.4.0
        with:
          name: plan095-ci-gate
          path: ${{ github.workspace }}/target/interop/evidence/plan095-ci-gate.json
          if-no-files-found: error
          retention-days: 14

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check workspace
        run: cargo check --locked --workspace
      - name: Check all workspace targets
        run: cargo check --locked --workspace --all-targets
      - name: Run tests (macOS)
        # The workspace includes several real loopback listener suites.
        # macOS runners become flaky when Cargo launches the workspace's
        # loopback test binaries together. Build the complete test set once,
        # then run every test executable serially with one libtest worker.
        if: runner.os == 'macOS'
        run: |
          executable_list="$RUNNER_TEMP/i2pr-test-executables.txt"
          cargo test --locked --workspace --no-run --message-format=json-render-diagnostics \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' \
            > "$executable_list"
          set +e
          while IFS= read -r executable; do
            [ -n "$executable" ] || continue
            "$executable" --test-threads=1
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error title=macOS test executable failed::$executable exited with $status"
              exit "$status"
            fi
          done < "$executable_list"
          set -e
          cargo test --locked --workspace --doc
      - name: Run tests
        if: runner.os != 'macOS'
        run: cargo test --locked --workspace
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check dependency direction
        run: bash scripts/check-dependency-direction.sh
      - name: Check runtime boundaries
        if: runner.os == 'Linux'
        run: bash scripts/check-runtime-boundaries.sh
      - name: Check fixture manifest
        if: runner.os == 'Linux'
        run: bash scripts/check-fixture-manifest.sh
      - name: Check NTCP2 vectors
        if: runner.os == 'Linux'
        run: bash scripts/check-ntcp2-vectors.sh
      - name: Check NTCP2 interoperability evidence boundary
        if: runner.os == 'Linux'
        run: bash scripts/check-ntcp2-interoperability.sh
      - name: Check constrained-host lane boundary
        if: runner.os == 'Linux'
        run: bash scripts/check-constrained-host-lane-boundary.sh
      - name: Test constrained-host lane contracts
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests/integration/ntcp2/harness -p 'test_execution_lane.py'

  msrv:
    name: MSRV (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install declared MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - name: Check workspace on MSRV
        run: cargo check --locked --workspace --all-targets

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Check advisories, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

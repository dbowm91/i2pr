name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Install ripgrep (Linux)
        # Plan 189-194 static evidence checkers use `rg` to verify
        # guarded labels. The default ubuntu-latest image does not
        # ship ripgrep, so install it before any check that needs it.
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep
      - name: Provision PyYAML for the workflow-validity guard
        # Plan 372. `scripts/check-workflow-validity.py` (Plan 365) needs
        # PyYAML and deliberately exits 2 rather than reporting success
        # when the import fails -- that posture is correct and unchanged.
        # The defect was that nothing ever installed the dependency:
        # ubuntu-latest ships PyYAML and passed, macos-latest does not,
        # so `Quality (macos-latest)` was red on `main` too and the
        # guard had never actually run there.
        #
        # This is a CI-only tooling dependency. It is deliberately NOT
        # added to any Cargo.toml or to Cargo.lock, and NOT vendored:
        # making the guard skip when PyYAML is missing would re-open the
        # Plan 365 defect, where a floor step passes while checking
        # nothing. Provisioned or the job fails.
        #
        # `--user` is required and is not decoration. macOS runners put a
        # Homebrew Python on PATH, which is PEP 668 "externally managed":
        # a bare `pip install` there exits 1 with
        # `error: externally-managed-environment` -- verified on run
        # 37582892609, where the first attempt failed exactly that way.
        # Homebrew's own remedy text names `--user` and, failing that,
        # `--break-system-packages`. `--user` is used because it installs
        # into `~/.local` and leaves the managed interpreter untouched;
        # `--break-system-packages` can corrupt the Homebrew installation,
        # and a CI image is still a real machine. The flag is accepted
        # harmlessly by the Ubuntu runner, which is not externally managed.
        run: python3 -m pip install --user --disable-pip-version-check --quiet 'PyYAML==6.0.2'
      - name: Verify the workflow-validity guard can actually run here
        # A provisioning step that silently fails would restore exactly
        # the defect this fixes: the guard would be skipped and the job
        # would report success on an unchecked tree. Assert the import
        # here so the failure is attributable to provisioning rather
        # than to whichever guard happened to need it first.
        run: python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check workspace
        run: cargo check --locked --workspace
      - name: Check all workspace targets
        run: cargo check --locked --workspace --all-targets
      # Plan 369: `cargo check`, `cargo test --all-targets` and `cargo clippy`
      # all emit test harnesses under target/debug/deps, never the plain
      # `target/debug/<name>` binaries. The managed-app black-box qualification
      # in `i2pr-daemon` execs real sibling executables (`i2pr-appd`'s fixture
      # manager and `i2pr-apphost`) out of target/debug, so without this step it
      # would either run last week's binaries or, because its `assert_fresh`
      # staleness guard exists, fail the build for the right reason and still
      # not test what it claims to.
      - name: Build managed-app black-box siblings
        run: cargo build --locked -p i2pr-app-fixture -p i2pr-apphost
      - name: Run tests (macOS)
        # The workspace includes several real loopback listener suites.
        # macOS runners become flaky when Cargo launches the workspace's
        # loopback test binaries together. Build the complete test set once,
        # then run every test executable serially with one libtest worker.
        if: runner.os == 'macOS'
        run: |
          executable_list="$RUNNER_TEMP/i2pr-test-executables.txt"
          cargo test --locked --workspace --no-run --message-format=json-render-diagnostics \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' \
            > "$executable_list"
          while IFS= read -r executable; do
            [ -n "$executable" ] || continue
            "$executable" --test-threads=1
          done < "$executable_list"
          cargo test --locked --workspace --doc
      - name: Run tests
        if: runner.os != 'macOS'
        run: cargo test --locked --workspace -- --test-threads=1
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check dependency direction
        run: bash scripts/check-dependency-direction.sh
      - name: Check service-tunnel ownership boundary
        if: runner.os == 'Linux'
        run: bash scripts/check-service-tunnel-boundaries.sh
      - name: Check managed-app gateway boundary
        run: python3 scripts/check-managed-app-gateway-boundary.py
      - name: Check managed-app manager boundary
        run: python3 scripts/check-managed-app-manager-boundary.py
      - name: Check managed-app process boundary
        run: |
          python3 scripts/check-managed-app-process-boundary.py
          python3 scripts/check-managed-app-process-boundary.py --self-test
      - name: Check portable service-tunnel API snapshot
        run: python3 scripts/check-portable-service-tunnel-api.py
      - name: Check portable service-tunnel external consumer
        if: runner.os == 'Linux'
        run: bash scripts/check-portable-service-tunnel-consumer.sh
      - name: Check global plan-number ownership
        run: python3 scripts/check-global-plan-number-uniqueness.py
      - name: Test planning checkers
        run: python3 -m unittest discover -s tests/planning -p 'test_*.py'
      - name: Check runtime boundaries
        if: runner.os == 'Linux'
        run: bash scripts/check-runtime-boundaries.sh
      - name: Check managed-app private client seams
        run: python3 scripts/check-managed-app-private-client-seams.py
      - name: Check router-console ownership boundary
        if: runner.os == 'Linux'
        run: bash scripts/check-console-boundaries.sh
      - name: Check router-console browser security
        if: runner.os == 'Linux'
        run: bash scripts/check-console-browser-security.sh
      # Plan 372. This guard derives every published inventory figure in
      # docs/architecture/tooling.md from the tree and fails closed when one
      # stops matching. It is the control that stops the next plan from
      # adding a guard, or a crate, without updating the document that
      # inventories them.
      - name: Check tooling inventory
        run: python3 scripts/check-tooling-inventory.py
      - name: Check tooling inventory (self-test)
        run: python3 scripts/check-tooling-inventory.py --self-test
      - name: Check fixture manifest
        if: runner.os == 'Linux'
        run: bash scripts/check-fixture-manifest.sh
      - name: Check NTCP2 vectors
        if: runner.os == 'Linux'
        run: bash scripts/check-ntcp2-vectors.sh
      - name: Check SSU2 vectors
        if: runner.os == 'Linux'
        run: bash scripts/check-ssu2-vectors.sh
      - name: Check I2CP vectors
        if: runner.os == 'Linux'
        run: bash scripts/check-i2cp-vectors.sh
      - name: Check NTCP2 interoperability evidence boundary
        if: runner.os == 'Linux'
        run: bash scripts/check-ntcp2-interoperability.sh
      - name: Check constrained-host lane boundary
        if: runner.os == 'Linux'
        run: bash scripts/check-constrained-host-lane-boundary.sh
      - name: Check SAM acceptance evidence integrity
        if: runner.os == 'Linux'
        run: bash scripts/check-sam-acceptance-evidence.sh
      - name: Check SSU2 acceptance evidence integrity
        if: runner.os == 'Linux'
        run: bash scripts/check-ssu2-acceptance-evidence.sh
      - name: Check I2CP acceptance evidence integrity
        if: runner.os == 'Linux'
        run: bash scripts/check-i2cp-acceptance-evidence.sh
      - name: Check I2PControl acceptance evidence integrity
        if: runner.os == 'Linux'
        run: bash scripts/check-i2pcontrol-acceptance-evidence.sh
      - name: Check service-tunnel acceptance evidence integrity
        if: runner.os == 'Linux'
        run: bash scripts/check-service-tunnel-acceptance-evidence.sh
      - name: Check exploratory tunnel evidence integrity
        if: runner.os == 'Linux'
        run: bash scripts/check-exploratory-tunnel-evidence.sh
      - name: Check NetDB tunnel evidence integrity
        if: runner.os == 'Linux'
        run: bash scripts/check-netdb-tunnel-evidence.sh
      - name: Check destination tunnel evidence integrity
        if: runner.os == 'Linux'
        run: bash scripts/check-destination-tunnel-evidence.sh
      - name: Check streaming tunnel evidence integrity
        if: runner.os == 'Linux'
        run: bash scripts/check-streaming-tunnel-evidence.sh
      - name: Check M6 mixed-router acceptance evidence integrity
        if: runner.os == 'Linux'
        run: bash scripts/check-m6-mixed-router-acceptance-evidence.sh
      - name: Check M12 floodfill qualification evidence integrity
        if: runner.os == 'Linux'
        run: bash scripts/check-m12-floodfill-qualification-evidence.sh --self-test
      - name: Check M12 floodfill boundaries
        if: runner.os == 'Linux'
        run: bash scripts/check-m12-floodfill-boundaries.sh --self-test
      - name: Check M11 transit boundaries
        if: runner.os == 'Linux'
        run: bash scripts/check-m11-transit-boundaries.sh
      - name: Check Java source-lock test gating
        if: runner.os == 'Linux'
        run: bash scripts/check-java-source-lock-gating.sh
      - name: Test constrained-host lane contracts
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests/integration/ntcp2/harness -p 'test_execution_lane.py'

  msrv:
    name: MSRV (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install declared MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - name: Check workspace on MSRV
        run: cargo check --locked --workspace --all-targets

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Check advisories, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

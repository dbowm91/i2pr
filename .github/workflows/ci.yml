name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check workspace
        run: cargo check --locked --workspace
      - name: Check all workspace targets
        run: cargo check --locked --workspace --all-targets
      - name: Isolate Plan 139 API tests (macOS)
        if: runner.os == 'macOS'
        run: cargo test --locked -p i2pr-api --test sam_plan139 -- --test-threads=1
      - name: Plan 139 forward ownership test (macOS)
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          log_file="$RUNNER_TEMP/plan139-forward.log"
          cargo test --locked -p i2pr-daemon --test sam_forward_naming forward_registers_real_loopback_target_and_owner_close_removes_it -- --test-threads=1 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(grep -E 'panicked at|assertion|----|test result' "$log_file" | tail -n 8 | tr '\n' ' ')
            echo "::error title=Plan 139 macOS failure::$detail"
          fi
          exit "$status"
      - name: Plan 139 silent forward test (macOS)
        if: runner.os == 'macOS'
        run: cargo test --locked -p i2pr-daemon --test sam_forward_naming silent_forward_passes_application_bytes_without_metadata -- --test-threads=1
      - name: Plan 139 naming test (macOS)
        if: runner.os == 'macOS'
        run: cargo test --locked -p i2pr-daemon --test sam_forward_naming naming_me_is_session_scoped_and_unknown_i2p_is_not_found -- --test-threads=1
      - name: Run tests (macOS)
        # The workspace includes several real loopback listener suites.
        # macOS runners become flaky when those suites fan out across the
        # default libtest worker pool; retain the complete suite while
        # serializing test cases on that runner.
        if: runner.os == 'macOS'
        run: cargo test --locked --workspace -- --test-threads=1
      - name: Run tests
        if: runner.os != 'macOS'
        run: cargo test --locked --workspace
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check dependency direction
        run: bash scripts/check-dependency-direction.sh
      - name: Check runtime boundaries
        if: runner.os == 'Linux'
        run: bash scripts/check-runtime-boundaries.sh
      - name: Check fixture manifest
        if: runner.os == 'Linux'
        run: bash scripts/check-fixture-manifest.sh
      - name: Check NTCP2 vectors
        if: runner.os == 'Linux'
        run: bash scripts/check-ntcp2-vectors.sh
      - name: Check NTCP2 interoperability evidence boundary
        if: runner.os == 'Linux'
        run: bash scripts/check-ntcp2-interoperability.sh
      - name: Check constrained-host lane boundary
        if: runner.os == 'Linux'
        run: bash scripts/check-constrained-host-lane-boundary.sh
      - name: Test constrained-host lane contracts
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests/integration/ntcp2/harness -p 'test_execution_lane.py'

  msrv:
    name: MSRV (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install declared MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - name: Check workspace on MSRV
        run: cargo check --locked --workspace --all-targets

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Check advisories, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

name: Build i2pr arm64

# Manual only. This workflow exists to produce a runnable `i2pr` binary for an
# rebuild the arm64 artifact for Plan 549: the path in use is re-proved (build 3)
#
# rebuild the arm64 artifact for Plan 549: the path in use is re-proved (build 3)
# cross-compiling, for one concrete reason: the crypto backend (`ring`) compiles
# C and assembly, so an aarch64 build needs an aarch64 C toolchain and a libc
# matching the **target**. Building natively on 22.04 links against glibc 2.35,
# which is exactly what the target host runs; a binary cross-built on a newer
# host would need a newer glibc and would fail at exec with a version error that
# looks like a code defect.
#
# Rebuild procedure. The artifact is pinned to the commit it was built from, so
# a lab run against a newer `crates/` tree needs a **new** artifact -- and the
# trigger below is filtered to this file, which means a code push does not
# start one. To rebuild: update this comment with the commit and the reason,
# push, and download the run. `workflow_dispatch` cannot be used from a working
# branch, because GitHub only surfaces it from the default branch.
#
# Rebuilt for Plan 546 at 6777452b: the far host now runs with
# `[ssu2] publish_bound_address = true` so it can publish its bound LAN
# address and serve as the floodfill the two-host measurement needed.
#
# Rebuilt for Plan 547 at a17efbd1: the far host now runs with
# `[ssu2] peer_test = true`, so the router owns the peer test that supplies
# the third corroboration class, and the re-dating path can install the
# dual-transport record. Both gates stood between the far host and the
# floodfill role.
#
# Rebuilt for Plan 547 at 4139fc7d: the peer test now reports its own
# progress and the transport names the reason a handshake ended. The
# three-host measurement reached the floodfill role on the far host and then
# lost it when the thirty-minute observation window lapsed, and neither the
# peer test nor the SSU2 dial reported anything, so the loss could not be
# diagnosed from either host's log. This rebuild is the instrumentation, not
# a wire change: the far host still runs the same peer test with the same
# opt-in, and now says what it is doing.
#
# Why a **logging** change is a behaviour change here. The lab proves
# directions by reading each host's log, so a build that cannot say it dialled
# is indistinguishable from a host that never dialled. Two diagnoses in the
# Plans 544/545 run were delayed by exactly that: a pool that was dialling and
# succeeding looked identical to one that never tried. Rebuild the far host
# whenever the observability of a path under test changes, not only when its
# wire behaviour does.

on:
  workflow_dispatch:
  # GitHub only surfaces `workflow_dispatch` from the **default** branch, so a
  # dispatch-only workflow is invisible on a working branch and cannot be
  # started there. The push trigger is filtered to this file, so it fires when
  # the recipe itself changes and stays dormant for every other push.
  push:
    paths:
      - '.github/workflows/build-i2pr-arm64.yml'

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build i2pr (Linux aarch64)
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      # The daemon is the only binary the LAN run needs. `--locked` is the
      # repository's rule: the lock file is the dependency set under test.
      - name: Build the daemon
        run: cargo build --locked --release -p i2pr-daemon --bin i2pr
      # The fingerprint is evidence: it lets the far host prove which bytes it
      # is running, and it lets a receipt name the artifact it evaluated.
      - name: Fingerprint the binary
        run: |
          set -eu
          sha256sum target/release/i2pr | tee i2pr.sha256
          file target/release/i2pr || true
          readelf -p .comment target/release/i2pr 2>/dev/null || true
      - name: Package the artifact
        run: |
          set -eu
          tar -czf i2pr-linux-aarch64.tar.gz -C target/release i2pr
          sha256sum i2pr-linux-aarch64.tar.gz | tee i2pr-linux-aarch64.tar.gz.sha256
      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: i2pr-linux-aarch64
          path: |
            i2pr-linux-aarch64.tar.gz
            i2pr-linux-aarch64.tar.gz.sha256
            i2pr.sha256
          if-no-files-found: error
          retention-days: 14
